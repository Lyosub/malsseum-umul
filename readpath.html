<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'msu_readpath_', LAST = 'msu_readpath_last';
  function get(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var want = new URLSearchParams(location.search).get('path');
  var cur = READ_PATHS.filter(function (p) { return p.id === want; })[0] || READ_PATHS.filter(function (p) { return p.id === get(LAST, ''); })[0] || READ_PATHS[0];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function tabs() {
    $('rpTabs').innerHTML = READ_PATHS.map(function (p) {
      return '<button type="button" data-id="' + p.id + '" aria-pressed="' + (p.id === cur.id) + '">' + esc(p.tab) + '</button>';
    }).join('');
  }
  function render() {
    var done = get(KEY + cur.id, []);
    $('rpTitle').textContent = cur.title;
    $('rpDesc').textContent = cur.desc;
    var n = cur.days.filter(function (d, i) { return done.indexOf(i) > -1; }).length;
    $('rpBar').style.width = Math.round(n / cur.days.length * 100) + '%';
    $('rpProg').textContent = n === cur.days.length ? '다 읽었어요! 수고했어요 🙌' : cur.days.length + '일 중 ' + n + '일 읽었어요';
    $('rpDays').innerHTML = cur.days.map(function (d, i) {
      var b = findBibleBook(d[0]), url = bibleReadUrl(d[0], d[1]), on = done.indexOf(i) > -1;
      return '<div class="rp-day' + (on ? ' done' : '') + '"><div class="rp-n">' + (i + 1) + '</div>' +
        '<div class="rp-t">' + esc(d[3]) + '<small>' + esc(b.name + ' ' + d[1] + '장' + (d[2] ? ' ' + d[2] + '절' : '')) + '</small></div>' +
        '<p class="rp-q">' + esc(d[4]) + '</p>' +
        '<div class="rp-act"><a href="' + url + '" target="_blank" rel="noopener" data-i="' + i + '">본문 읽기 ↗</a>' +
        '<button type="button" data-done="' + i + '">' + (on ? '✓ 읽었어요' : '읽었어요') + '</button></div></div>';
    }).join('');
  }
  $('rpTabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    cur = READ_PATHS.filter(function (p) { return p.id === b.dataset.id; })[0];
    put(LAST, cur.id); tabs(); render();
    history.replaceState(null, '', '?path=' + cur.id);
  });
  $('rpDays').addEventListener('click', function (e) {
    var a = e.target.closest('a[data-i]');
    if (a) { var d = cur.days[+a.dataset.i], bk = findBibleBook(d[0]); saveReadingProgress(bk.id, bk.name, d[1]); return; }
    var b = e.target.closest('button[data-done]'); if (!b) return;
    var i = +b.dataset.done, done = get(KEY + cur.id, []), k = done.indexOf(i);
    if (k > -1) done.splice(k, 1); else done.push(i);
    put(KEY + cur.id, done); put(LAST, cur.id); render();
  });
  tabs(); render();
})();
</script>
