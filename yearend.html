<style>
  .ye-sec-title { font-size:16px; font-weight:800; color:var(--well-deep); margin:0 0 4px; }
  .ye-sub { font-size:13px; color:var(--text-soft); line-height:1.65; margin:0 0 12px; }
  .ye-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ye-stat { background:#f6f7fd; border:1.5px solid #dfe3f4; border-radius:14px; padding:12px; }
  .ye-stat b { display:block; font-size:24px; font-weight:800; color:#17287e; line-height:1.15; }
  .ye-stat span { font-size:12px; font-weight:700; color:var(--text-soft); }
  .ye-stat.wide { grid-column:1 / -1; }
  /* 뽑기 시작 칸 */
  .ye-start { text-align:center; }
  .ye-fan { position:relative; height:150px; margin:8px 0 14px; }
  .ye-fan span { position:absolute; left:50%; top:10px; width:92px; height:128px; margin-left:-46px; border-radius:12px; background:linear-gradient(155deg,#17287e,#2540d8); border:2px solid #e9c46a; color:#ffe7a8; display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 6px 16px rgba(23,40,126,.3); animation:yeFloat 3s ease-in-out infinite; }
  .ye-fan span:nth-child(1) { transform:translateX(-62px) rotate(-14deg); animation-delay:.3s; }
  .ye-fan span:nth-child(3) { transform:translateX(62px) rotate(14deg); animation-delay:.9s; }
  .ye-fan span:nth-child(2) { z-index:1; background:linear-gradient(160deg,#fffaf0,#f6e3b4); border-color:#c9932f; color:#5a3c06; font-size:14px; font-weight:800; line-height:1.35; text-align:center; }
  @keyframes yeFloat { 0%,100% { margin-top:0; } 50% { margin-top:-7px; } }
  .ye-go { width:100%; min-height:56px; border:0; border-radius:16px; background:linear-gradient(135deg,#17287e,#2540d8); color:#fff; font-family:inherit; font-size:17px; font-weight:800; cursor:pointer; box-shadow:0 6px 18px rgba(23,40,126,.35), inset 0 0 0 2px rgba(233,196,106,.7); animation:yeGoGlow 2.4s ease-in-out infinite; }
  .ye-go:active { transform:scale(.98); }
  .ye-go:disabled { opacity:.6; animation:none; }
  @keyframes yeGoGlow { 0%,100% { box-shadow:0 6px 18px rgba(23,40,126,.35), inset 0 0 0 2px rgba(233,196,106,.7); } 50% { box-shadow:0 6px 26px rgba(233,196,106,.6), inset 0 0 0 2px rgba(255,231,168,1); } }
  /* 뽑기 연출: 말씀들이 돌아가다 하나에 멈춘다 */
  .ye-stage { position:fixed; inset:0; z-index:2000; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(6,10,34,0); transition:background .5s; }
  .ye-stage.on { background:rgba(6,10,34,.9); }
  .ye-stage.out { opacity:0; transition:opacity .6s; }
  .ye-stage-title { color:#ffe7a8; font-size:15px; font-weight:800; margin-bottom:14px; letter-spacing:.02em; opacity:0; transition:opacity .5s .2s; }
  .ye-stage.on .ye-stage-title { opacity:1; }
  .ye-rays { position:absolute; left:50%; top:50%; width:560px; height:560px; margin:-280px 0 0 -280px; border-radius:50%; background:repeating-conic-gradient(from 0deg, rgba(255,226,150,.24) 0 8deg, transparent 8deg 22deg); opacity:0; transform:scale(.3); transition:opacity .6s, transform 1.2s; animation:yeSpin 9s linear infinite; pointer-events:none; }
  .ye-stage.lit .ye-rays { opacity:1; transform:scale(1); }
  @keyframes yeSpin { to { rotate:360deg; } }
  .ye-reel { position:relative; width:min(320px, 86vw); height:360px; overflow:hidden; border-radius:18px; -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 26%, #000 74%, transparent 100%); mask-image:linear-gradient(180deg, transparent 0, #000 26%, #000 74%, transparent 100%); }
  .ye-frame { position:absolute; left:50%; top:50%; width:min(320px, 86vw); height:124px; transform:translate(-50%, -50%); border:3px solid #e9c46a; border-radius:18px; box-shadow:0 0 24px rgba(233,196,106,.6), inset 0 0 18px rgba(233,196,106,.25); pointer-events:none; transition:box-shadow .4s, border-color .4s; }
  .ye-stage.lit .ye-frame { border-color:#fff3c4; box-shadow:0 0 50px rgba(255,226,150,.95), inset 0 0 26px rgba(255,226,150,.5); }
  .ye-strip { position:absolute; left:0; right:0; top:118px; will-change:transform; }
  .ye-strip.spin { animation:yeRoll .7s linear infinite; }
  @keyframes yeRoll { from { transform:translateY(0); } to { transform:translateY(calc(var(--loop) * -1)); } }
  .ye-item { height:124px; box-sizing:border-box; padding:16px 18px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#fff; }
  .ye-item b { font-size:19px; font-weight:800; color:#ffe7a8; }
  .ye-item span { font-size:13.5px; color:rgba(255,255,255,.78); margin-top:6px; line-height:1.45; word-break:keep-all; }
  .ye-item.win { animation:yeWin .7s cubic-bezier(.2,1.5,.4,1) both; }
  .ye-item.win b { font-size:22px; color:#fff6dc; text-shadow:0 0 14px rgba(255,226,150,.9); }
  @keyframes yeWin { from { transform:scale(1); } to { transform:scale(1.1); } }
  .ye-spark { position:absolute; left:50%; top:50%; width:var(--s); height:var(--s); margin:calc(var(--s) / -2); border-radius:50%; background:radial-gradient(circle, #fff 0 25%, #ffe08a 45%, rgba(255,200,80,0) 72%); animation:yeBurst var(--d) cubic-bezier(.1,.7,.3,1) forwards; pointer-events:none; }
  .ye-spark.star { border-radius:0; background:none; color:#ffe08a; font-size:var(--s); width:auto; height:auto; margin:0; line-height:1; text-shadow:0 0 8px rgba(255,224,138,.9); }
  @keyframes yeBurst { 0% { transform:translate(0,0) scale(.3); opacity:1; } 70% { opacity:1; } 100% { transform:translate(var(--x), var(--y)) scale(1); opacity:0; } }
  .ye-tap { margin-top:22px; color:rgba(255,255,255,.82); font-size:14px; font-weight:700; min-height:20px; text-align:center; padding:0 16px; }
  /* 결과: 카드 미리보기와 디자인 고르기 */
  .ye-result { text-align:center; }
  .ye-preview { display:block; margin:12px auto 4px; max-width:100%; max-height:66vh; border-radius:14px; box-shadow:0 8px 24px rgba(23,40,126,.25); }
  .ye-result.reveal .ye-preview { animation:yeReveal 1.1s ease-out both; }
  @keyframes yeReveal { from { opacity:0; transform:scale(.92); filter:brightness(2); } to { opacity:1; transform:none; filter:none; } }
  .ye-designs { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:6px 0 4px; }
  .ye-design { border:2px solid #dfe3f4; border-radius:12px; padding:5px 5px 6px; background:#fff; font-family:inherit; font-size:12px; font-weight:800; color:#17287e; cursor:pointer; }
  .ye-design img { display:block; width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:8px; margin-bottom:5px; background:#eef1fb; }
  .ye-design.on { border-color:#c9932f; box-shadow:0 0 0 3px rgba(233,196,106,.45); }
  .ye-small { font-size:12.5px; color:var(--text-soft); margin:14px 0 6px; text-align:left; font-weight:700; }
  @media (prefers-reduced-motion: reduce) {
    .ye-rays, .ye-fan span, .ye-go, .ye-strip.spin, .ye-spark { animation:none !important; }
  }

  .ye-label { display:inline-block; font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; background:#fbf3e0; color:#7a5310; }
  .ye-ref { font-size:15px; font-weight:800; color:var(--well); margin:12px 0 6px; }
  .ye-verse { font-size:18px; line-height:1.75; font-weight:800; color:var(--text); margin:0 0 10px; word-break:keep-all; }
  .ye-note { font-size:13.5px; color:var(--text-soft); line-height:1.7; margin:0 0 12px; }
  .ye-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .ye-btns > * { flex:1 1 140px; }
  .ye-msg { text-align:center; font-size:14px; color:var(--text-soft); }
  .ye-link { display:block; margin:12px auto 0; background:none; border:0; font-family:inherit; font-size:14px; font-weight:700; color:var(--well); min-height:40px; padding:6px 12px; cursor:pointer; }
  .ye-count { font-size:28px; font-weight:800; color:#17287e; display:block; margin:4px 0; }
</style>

<script>
  initHeaderAuthState();
  (function () {
    var Y = YEAREND_YEAR, NEXT = Y + 1;
    var GUEST_KEY = "msu_yearend_pick_" + Y;
    var $ = function (id) { return document.getElementById(id); };
    var state = { user: null, review: null, staff: false, pick: null, design: "photo" };

    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function kst() { var d = new Date(Date.now() + 9 * 3600e3); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
    // 화면에서도 같은 기간을 쓴다(서버 yearend_is_open과 같음). 관리자·부장은 서버가 미리 열어 준다.
    // 11/6~11/30은 모두에게 미리 해 보는 기간(12/1 0시에 서버가 시험 기록을 지운다), 12/1~1/31이 진짜 뽑기 기간.
    var TEST_FROM = Date.UTC(Y, 10, 6), REAL_FROM = Date.UTC(Y, 11, 1);
    function openByDate() { var t = kst(); return t >= TEST_FROM && t <= Date.UTC(NEXT, 0, 31); }
    function inTest() { var t = kst(); return t >= TEST_FROM && t < REAL_FROM; }
    // 비로그인: 시험 기간에 이 기기에 저장한 말씀은 12/1부터 지운다.
    (function () {
      try {
        var at = Number(localStorage.getItem(GUEST_KEY + "_at") || 0);
        if (kst() >= REAL_FROM && localStorage.getItem(GUEST_KEY) != null && at < REAL_FROM) {
          localStorage.removeItem(GUEST_KEY); localStorage.removeItem(GUEST_KEY + "_at");
        }
      } catch (e) {}
    })();
    function testNote() {
      if (!inTest()) return;
      var box = $("yeClosed");
      box.innerHTML = '<p class="ye-msg">🧪 지금은 미리 해 보는 기간이에요.<br>지금 뽑은 말씀은 11월 30일 밤에 지워지고,<br><b>12월 1일부터 다시 뽑을 수 있어요.</b></p>';
      box.style.display = "block";
    }
    // 뽑기가 끝난 뒤(2/1부터)에는 새로 뽑을 수 없고, 이미 뽑은 사람은 자기 말씀을 계속 본다.
    function ended() { return kst() > Date.UTC(NEXT, 0, 31); }

    function showClosed() {
      var left = Math.round((Date.UTC(Y, 11, 1) - kst()) / 86400000);
      var box = $("yeClosed");
      var isEnded = ended();
      box.innerHTML = left > 0
        ? '<p class="ye-msg">12월 1일에 열려요<span class="ye-count">D-' + left + '</span>12월 1일부터 1월 31일까지 한 해를 돌아보고,<br>' + NEXT + '년을 여는 말씀카드 한 장을 뽑아요.</p>'
        : isEnded ? '<p class="ye-msg">새해 말씀카드 뽑기는 1월 31일에 끝났어요.</p>'
        : '<p class="ye-msg">곧 열려요. 잠시 뒤 다시 열어 주세요.</p>';
      if (!isEnded) box.innerHTML += '<button type="button" class="ye-link" data-share-link>🔗 뽑기 링크 미리 보내 두기</button><p class="msg" data-share-msg style="text-align:center;"></p>';
      box.style.display = "block";
    }

    function stat(n, label, wide) {
      return '<div class="ye-stat' + (wide ? " wide" : "") + '"><b>' + n + '</b><span>' + label + '</span></div>';
    }
    function renderReview(r) {
      var box = $("yeReview");
      var j = r.joined ? new Date(r.joined + "T00:00:00") : null;
      var rows = [];
      if (r.attend) rows.push(stat(r.attend + "일", "출석한 날"));
      if (r.best_streak > 1) rows.push(stat(r.best_streak + "일", "가장 길게 이어 간 출석"));
      if (r.devotion) rows.push(stat(r.devotion + "일", "오늘의 QT 묵상"));
      if (r.memorize) rows.push(stat(r.memorize + "일", "말씀 외우기"));
      if (r.gratitude) rows.push(stat(r.gratitude + "개", "감사노트"));
      if (r.prayer) rows.push(stat(r.prayer + "개", "기도제목"));
      if (r.lines) rows.push(stat(r.lines + "번", "설교 한 줄"));
      if (r.odyssey) rows.push(stat(r.odyssey + "편", "In Odyssey 완료"));
      if (r.level) rows.push(stat("Lv." + r.level, "우물지기 레벨"));
      if (rows.length % 2 === 1) rows[rows.length - 1] = rows[rows.length - 1].replace('class="ye-stat"', 'class="ye-stat wide"');
      box.innerHTML =
        '<div class="ye-sec-title">' + esc(r.nickname || "나") + '님의 ' + Y + ' 말씀우물</div>' +
        '<p class="ye-sub">' + (j ? (j.getMonth() + 1) + '월 ' + j.getDate() + '일에 처음 함께했어요. ' : '') + '올 한 해 이렇게 말씀 곁에 있었어요.</p>' +
        (rows.length ? '<div class="ye-stats">' + rows.join("") + '</div>' : '<p class="ye-sub">아직 쌓인 기록이 많지 않아요. 새해에는 매일 한 걸음씩 함께해요.</p>');
      box.style.display = "block";
    }

    function renderDeck() {
      var box = $("yeDraw");
      box.className = "card ye-start";
      box.innerHTML =
        '<div class="ye-sec-title">' + NEXT + '년을 여는 말씀카드</div>' +
        '<p class="ye-sub">한 해를 지켜 주신 하나님께 감사하며 잠깐 기도해 보세요.<br>그리고 아래 버튼을 눌러 새해 말씀을 받아 보세요.' +
        (state.user ? '<br>한 사람이 한 번만 뽑을 수 있어요.' : '<br><a href="login.html" style="color:var(--well);font-weight:700;">로그인</a>하면 한 해 기록도 함께 볼 수 있어요.') + '</p>' +
        '<div class="ye-fan" aria-hidden="true"><span>✦</span><span>' + NEXT + '<br>말씀</span><span>✦</span></div>' +
        '<button type="button" class="ye-go" id="yeGoBtn">✦ 말씀 뽑기</button>' +
        '<p class="msg" id="yeDrawMsg" style="text-align:center;margin-top:10px;"></p>' +
        '<button type="button" class="ye-link" data-share-link>🔗 친구에게 뽑기 링크 보내기</button><p class="msg" data-share-msg style="text-align:center;"></p>';
      box.style.display = "block";
      var btn = $("yeGoBtn");
      btn.onclick = function () {
        btn.disabled = true;
        $("yeDrawMsg").textContent = "";
        var el = stage();
        var t0 = Date.now();
        draw().then(function (pick) {
          if (pick == null) { el.remove(); btn.disabled = false; return; }
          setTimeout(function () {
            roll(el, pick, function () {
              $("yeDraw").style.display = "none";
              showResult(pick, true);
            });
          }, Math.max(0, 1100 - (Date.now() - t0)));
        });
      };
    }

    // ---- 뽑기 연출: 말씀들이 빠르게 돌다가 점점 느려져 하나에 멈춘다 ----
    var ITEM_H = 124;
    function itemHtml(v, win) {
      var s = v.text.length > 26 ? v.text.slice(0, 26) + "…" : v.text;
      return '<div class="ye-item' + (win ? " win-target" : "") + '"><b>' + esc(v.ref) + '</b><span>' + esc(s) + '</span></div>';
    }
    function randomVerses(n, not) {
      var out = [];
      while (out.length < n) {
        var i = Math.floor(Math.random() * YEAREND_VERSES.length);
        if (i !== not && (!out.length || out[out.length - 1] !== i)) out.push(i);
      }
      return out;
    }
    function stage() {
      var el = document.createElement("div");
      el.className = "ye-stage";
      el.innerHTML = '<div class="ye-rays"></div>' +
        '<div class="ye-stage-title">✦ 말씀을 고르고 있어요 ✦</div>' +
        '<div class="ye-reel"><div class="ye-strip spin"></div></div><div class="ye-frame"></div>' +
        '<div class="ye-tap">기도하는 마음으로 잠시 기다려 주세요</div>';
      // 기다리는 동안 도는 띠: 같은 묶음을 두 번 이어 붙여 끊김 없이 돈다.
      var loop = randomVerses(14, -1).map(function (i) { return itemHtml(YEAREND_VERSES[i]); }).join("");
      var strip = el.querySelector(".ye-strip");
      strip.innerHTML = loop + loop;
      strip.style.setProperty("--loop", (14 * ITEM_H) + "px");
      // 프레임을 띠 가운데 칸에 맞춘다.
      document.body.appendChild(el);
      var reel = el.querySelector(".ye-reel"), frame = el.querySelector(".ye-frame");
      var r = reel.getBoundingClientRect();
      frame.style.top = (r.top + r.height / 2) + "px";
      requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add("on"); }); });
      return el;
    }
    function burst(el) {
      var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var n = reduce ? 0 : 46;
      var fr = el.querySelector(".ye-frame").getBoundingClientRect();
      var cx = fr.left + fr.width / 2, cy = fr.top + fr.height / 2;
      for (var i = 0; i < n; i++) {
        var s = document.createElement("span");
        var star = i % 3 === 0;
        s.className = "ye-spark" + (star ? " star" : "");
        if (star) s.textContent = i % 2 ? "✦" : "✧";
        s.style.left = cx + "px"; s.style.top = cy + "px";
        var ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 200;
        s.style.setProperty("--x", Math.round(Math.cos(ang) * dist) + "px");
        s.style.setProperty("--y", Math.round(Math.sin(ang) * dist) + "px");
        s.style.setProperty("--s", (star ? 14 + Math.random() * 14 : 6 + Math.random() * 10) + "px");
        s.style.setProperty("--d", (0.9 + Math.random() * 0.9) + "s");
        el.appendChild(s);
      }
      try { if (navigator.vibrate) navigator.vibrate([30, 60, 40]); } catch (e) {}
    }
    function roll(el, pick, done) {
      var v = YEAREND_VERSES[pick];
      var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var strip = el.querySelector(".ye-strip");
      var before = randomVerses(reduce ? 1 : 34, pick);
      var after = randomVerses(2, pick);
      strip.classList.remove("spin");
      strip.style.transition = "none";
      strip.style.transform = "translateY(0)";
      strip.innerHTML = before.map(function (i) { return itemHtml(YEAREND_VERSES[i]); }).join("") + itemHtml(v, true) + after.map(function (i) { return itemHtml(YEAREND_VERSES[i]); }).join("");
      var target = before.length * ITEM_H;
      var dur = reduce ? 300 : 4200;
      strip.offsetHeight; // 위치를 먼저 잡고 움직인다
      strip.style.transition = "transform " + dur + "ms cubic-bezier(.12,.72,.14,1)";
      strip.style.transform = "translateY(-" + target + "px)";
      el.querySelector(".ye-tap").textContent = "";
      setTimeout(function () {
        var w = strip.querySelector(".win-target");
        if (w) w.classList.add("win");
        el.classList.add("lit");
        el.querySelector(".ye-stage-title").textContent = "✦ " + NEXT + " 나에게 주신 말씀 ✦";
        burst(el);
        el.querySelector(".ye-tap").textContent = "화면을 누르면 말씀이 펼쳐져요";
        var closed = false;
        function close() {
          if (closed) return; closed = true;
          el.classList.add("out");
          done();
          setTimeout(function () { el.remove(); }, 650);
        }
        el.addEventListener("click", close);
        setTimeout(close, 2800);
      }, dur + 80);
    }

    function draw() {
      if (!state.user) {
        var p = null;
        try { p = localStorage.getItem(GUEST_KEY); } catch (e) {}
        if (p == null || isNaN(Number(p)) || !YEAREND_VERSES[Number(p)]) {
          p = Math.floor(Math.random() * YEAREND_VERSES.length);
          try { localStorage.setItem(GUEST_KEY, String(p)); localStorage.setItem(GUEST_KEY + "_at", String(kst())); } catch (e) {}
        }
        return Promise.resolve(Number(p));
      }
      return getClient().rpc("draw_year_verse", { p_year: Y }).then(function (r) {
        if (r.error || !r.data || !r.data.ok) {
          $("yeDrawMsg").textContent = r.data && r.data.reason === "closed" ? "아직 뽑기가 열리지 않았어요." : "말씀을 뽑지 못했어요. 잠시 뒤 다시 눌러 주세요.";
          return null;
        }
        return r.data.pick;
      }, function () { $("yeDrawMsg").textContent = "인터넷 연결을 확인하고 다시 눌러 주세요."; return null; });
    }

    function cardWho() {
      var r = state.review;
      return r && r.nickname ? r.nickname + "님에게 주신 " + NEXT + " 말씀" : "";
    }
    function cardStats() {
      var r = state.review, tail = [];
      if (r && r.attend) tail.push(Y + " 출석 " + r.attend + "일");
      if (r && r.devotion) tail.push("묵상 " + r.devotion + "일");
      return tail.join(" · ");
    }

    // ---- 결과: 카드 미리보기, 디자인 6가지, 크기 고르기 ----
    var bgCache = {};
    function loadBg() {
      var n = state.bg;
      if (!n) return Promise.resolve(null);
      if (bgCache[n]) return bgCache[n];
      bgCache[n] = new Promise(function (res) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { res(null); }; im.src = "assets/verse-card-bg/verse-card-bg-" + String(n).padStart(2, "0") + ".jpg"; });
      return bgCache[n];
    }
    // 이 사람·이 말씀에 어울리는 카드를 정한다(사람마다 다를 수 있고, 다시 열어도 같다).
    function lookSeed(pick) {
      var id = state.user ? state.user.id : null;
      if (!id) {
        try { id = localStorage.getItem(GUEST_KEY + "_seed"); } catch (e) {}
        if (!id) { id = "g" + Math.floor(Math.random() * 1e9); try { localStorage.setItem(GUEST_KEY + "_seed", id); } catch (e) {} }
      }
      return yearCardSeed(id, pick);
    }
    function cardOpts(size, bg) {
      // 카드 아래에는 이름·출석 기록을 넣지 않는다(전도사님 11/6).
      return { W: size.w, H: size.h, bg: bg, seed: state.pick + 1 };
    }
    function currentSize() {
      return (typeof getSelectedSize === "function") ? getSelectedSize("yeSizePicker", "post") : { w: 1080, h: 1350 };
    }
    function renderPreview() {
      var v = YEAREND_VERSES[state.pick];
      var size = currentSize();
      var scale = 540 / size.w;
      Promise.all([loadYearCardFonts(v.text), loadBg()]).then(function (r) {
        var c = document.createElement("canvas");
        drawYearCard(c, state.design, v, cardOpts({ w: Math.round(size.w * scale), h: Math.round(size.h * scale) }, r[1]));
        var img = $("yePreview");
        if (img) img.src = c.toDataURL("image/jpeg", 0.9);
      });
    }
    function showResult(pick, fresh) {
      state.pick = pick;
      var v = YEAREND_VERSES[pick];
      if (!v) return;
      var look = yearCardLook(v, lookSeed(pick));
      state.design = look.design;
      state.bg = look.bg;
      if (!fresh) $("yeDraw").style.display = "none";
      var readHref = (typeof refToReadLink === "function" && refToReadLink(v.ref)) || "read.html";
      var box = $("yeResult");
      box.innerHTML =
        '<span class="ye-label">' + (fresh ? "🎁 내가 뽑은 " : "🎁 올해 뽑은 ") + NEXT + '년 말씀</span>' +
        '<div class="ye-ref">' + esc(v.ref) + '</div>' +
        '<img class="ye-preview" id="yePreview" alt="' + esc(v.ref + " " + v.text) + '">' +
        '<p class="ye-note" style="margin-top:8px;">' + NEXT + '년, 이 말씀과 함께 걸어가요.<br>휴대폰 배경으로 저장해 두면 매일 볼 수 있어요.</p>' +
        '<div class="ye-small">저장할 크기</div>' +
        '<div class="tabs" id="yeSizePicker"></div>' +
        '<div class="ye-btns">' +
          '<button type="button" class="btn" id="yeSaveBtn">🖼️ 카드 저장</button>' +
          '<a class="btn ghost" href="' + readHref + '"' + (/^https?:/.test(readHref) ? ' target="_blank" rel="noopener"' : '') + '>📖 본문 읽기</a>' +
        '</div>' +
        '<button type="button" class="ye-link" id="yeShareBtn">💬 이 말씀 나누기</button>' +
        (ended() ? '' : '<button type="button" class="ye-link" data-share-link style="margin-top:0;">🔗 친구에게 뽑기 링크 보내기</button><p class="msg" data-share-msg style="text-align:center;"></p>') +
        (state.staff ? '<button type="button" class="ye-link" id="yeResetBtn" style="margin-top:0;color:#a33;font-size:12.5px;">관리자 시험: 내 뽑기 지우고 다시 뽑기</button>' : '') +
        '<p class="msg" id="yeSaveMsg" style="text-align:center;margin-top:8px;"></p>';
      box.classList.toggle("reveal", !!fresh);
      box.style.display = "block";
      if (typeof initSizePicker === "function") initSizePicker("yeSizePicker", function () { renderPreview(); }, "post");
      renderPreview();
      $("yeSaveBtn").onclick = function () { saveCard(v); };
      $("yeShareBtn").onclick = function () { share(v); };
      var rb = $("yeResetBtn");
      if (rb) rb.onclick = function () {
        getClient().rpc("reset_my_year_draw", { p_year: Y }).then(function () {
          try { localStorage.removeItem(GUEST_KEY); } catch (e) {}
          box.style.display = "none";
          renderDeck();
        });
      };
      if (fresh) setTimeout(function () { box.scrollIntoView({ behavior: "smooth", block: "start" }); }, 100);
    }

    function saveCard(v) {
      var msg = $("yeSaveMsg");
      var size = currentSize();
      msg.textContent = "카드를 만드는 중...";
      Promise.all([loadYearCardFonts(v.text), loadBg()]).then(function (r) {
        var canvas = $("yeCanvas");
        drawYearCard(canvas, state.design, v, cardOpts(size, r[1]));
        var a = document.createElement("a");
        a.download = "말씀우물_" + NEXT + "_말씀카드.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
        msg.textContent = "저장했어요. 사진첩이나 다운로드 폴더에서 볼 수 있어요.";
      }).catch(function () { msg.textContent = "카드를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요."; });
    }

    function share(v) {
      var text = "[" + NEXT + "년을 여는 말씀] " + v.ref + "\n\"" + v.text + "\"\n\n말씀우물에서 나도 한 장 뽑아 보기 👉 " + SHARE_URL;
      var msg = $("yeSaveMsg");
      if (navigator.share) { navigator.share({ text: text }).catch(function () {}); return; }
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () {
        msg.textContent = "말씀을 복사했어요. 카톡에 붙여 넣어 나눠 보세요.";
      }, function () { msg.textContent = "이 기기에서는 나누기를 쓸 수 없어요."; });
    }

    // 뽑기 링크 나누기: 카톡 등으로 보낼 짧은 주소(logoswell.kr/2027 → 이 화면).
    var SHARE_URL = "https://logoswell.kr/2027";
    function shareLink(btn) {
      var msg = btn.parentNode.querySelector("[data-share-msg]");
      var text = NEXT + "년을 여는 말씀카드 한 장, 같이 뽑아요 🎁\n한 해를 돌아보며 새해 말씀을 받아 보세요.";
      if (navigator.share) { navigator.share({ title: "말씀우물 새해 말씀카드", text: text, url: SHARE_URL }).catch(function () {}); return; }
      (navigator.clipboard ? navigator.clipboard.writeText(text + "\n" + SHARE_URL) : Promise.reject()).then(function () {
        if (msg) msg.textContent = "링크를 복사했어요. 카톡에 붙여 넣어 보내 보세요.";
      }, function () { if (msg) msg.textContent = "링크: " + SHARE_URL; });
    }
    document.addEventListener("click", function (e) {
      var b = e.target.closest && e.target.closest("[data-share-link]");
      if (b) shareLink(b);
    });

    getSession().then(function (s) {
      state.user = s ? s.user : null;
      if (!state.user) {
        var p = null;
        try { p = localStorage.getItem(GUEST_KEY); } catch (e) {}
        var has = p != null && !isNaN(Number(p)) && YEAREND_VERSES[Number(p)];
        testNote();
        if (has) { showResult(Number(p), false); return; }
        if (!openByDate()) { showClosed(); return; }
        renderDeck();
        return;
      }
      return Promise.all([
        getClient().rpc("get_my_year_review", { p_year: Y }),
        getClient().from("profiles").select("is_admin, is_department_head").eq("user_id", state.user.id).single()
      ]).then(function (res) {
        var r = res[0].data, p = res[1].data;
        state.staff = !!(p && (p.is_admin || p.is_department_head));
        if (!r || !r.ok) { $("yeClosed").innerHTML = '<p class="ye-msg">기록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p>'; $("yeClosed").style.display = "block"; return; }
        state.review = r;
        if (!r.open && r.pick == null) { showClosed(); return; }
        if (!r.open) { renderReview(r); showResult(r.pick, false); return; }
        testNote();
        if (state.staff && !openByDate()) { $("yeClosed").innerHTML = '<p class="ye-msg">👀 관리자 미리보기예요. 다른 사람에게는 12월 1일에 열려요.</p>'; $("yeClosed").style.display = "block"; }
        renderReview(r);
        if (r.pick != null) showResult(r.pick, false); else renderDeck();
      });
    }).catch(function () {
      $("yeClosed").innerHTML = '<p class="ye-msg">화면을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>';
      $("yeClosed").style.display = "block";
    });
  })();
</script>
<script src="assets/appshell.js"></script>
</body>
</html>
