<style>
  .ye-sec-title { font-size:16px; font-weight:800; color:var(--well-deep); margin:0 0 4px; }
  .ye-sub { font-size:13px; color:var(--text-soft); line-height:1.65; margin:0 0 12px; }
  .ye-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ye-stat { background:#f6f7fd; border:1.5px solid #dfe3f4; border-radius:14px; padding:12px; }
  .ye-stat b { display:block; font-size:24px; font-weight:800; color:#17287e; line-height:1.15; }
  .ye-stat span { font-size:12px; font-weight:700; color:var(--text-soft); }
  .ye-stat.wide { grid-column:1 / -1; }
  .ye-deck { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; perspective:900px; margin-top:6px; }
  .ye-card { aspect-ratio:3/4.2; border:0; padding:0; background:none; cursor:pointer; position:relative; font-family:inherit; }
  .ye-card .in { position:absolute; inset:0; transition:transform .7s; transform-style:preserve-3d; }
  .ye-card .f, .ye-card .b { position:absolute; inset:0; border-radius:12px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; align-items:center; justify-content:center; }
  .ye-card .f { background:linear-gradient(155deg,#17287e,#2540d8); border:2px solid #c9932f; color:#e9c46a; font-size:22px; box-shadow:0 4px 10px rgba(23,40,126,.25); }
  .ye-card .b { background:#fffaf0; border:2px solid #c9932f; color:#7a5310; font-size:12px; font-weight:800; transform:rotateY(180deg); padding:4px; text-align:center; }
  .ye-card.flip .in { transform:rotateY(180deg); }
  .ye-deck.picking .ye-card:not(.flip) { opacity:.35; transition:opacity .4s; }
  .ye-deck.shuffle .ye-card { animation:yeShake .5s ease-in-out; }
  @keyframes yeShake { 0%,100% { transform:translateY(0) rotate(0); } 30% { transform:translateY(-6px) rotate(-3deg); } 60% { transform:translateY(2px) rotate(3deg); } }
  .ye-result { text-align:center; padding:0 !important; overflow:hidden; }
  .ye-photo { position:relative; padding:34px 18px 120px; background-color:#17287e; background-size:cover; background-position:center; color:#fff; }
  .ye-photo::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,12,40,.42) 0%, rgba(8,12,40,.22) 45%, rgba(8,12,40,.5) 100%); }
  .ye-photo > * { position:relative; }
  .ye-photo .ye-label { background:rgba(255,255,255,.16); color:#ffe7a8; border:1px solid rgba(255,231,168,.5); }
  .ye-photo .ye-ref { color:#ffe7a8; }
  .ye-photo .ye-verse { color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6), 0 2px 14px rgba(0,0,0,.5); }
  .ye-photo .ye-note, .ye-photo .ye-ref { text-shadow:0 1px 4px rgba(0,0,0,.6); }
  .ye-photo .ye-note { color:rgba(255,255,255,.88); margin-bottom:0; }
  .ye-actions { padding:16px 18px 18px; }
  .ye-result.reveal .ye-photo { animation:yeReveal 1s ease-out both; }
  .ye-result.reveal .ye-photo > * { animation:yeRise .9s ease-out both; }
  .ye-result.reveal .ye-ref { animation-delay:.25s; }
  .ye-result.reveal .ye-verse { animation-delay:.45s; }
  .ye-result.reveal .ye-note { animation-delay:.7s; }
  @keyframes yeReveal { from { filter:brightness(2.2) saturate(.4); } to { filter:none; } }
  @keyframes yeRise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  /* 카드판: 기다리는 동안 반짝임 */
  .ye-deck:not(.picking) .ye-card .f { animation:yeGlow 2.6s ease-in-out infinite; }
  .ye-deck .ye-card:nth-child(3n+1) .f { animation-delay:.4s; }
  .ye-deck .ye-card:nth-child(3n+2) .f { animation-delay:1.1s; }
  @keyframes yeGlow { 0%,100% { box-shadow:0 4px 10px rgba(23,40,126,.25); } 50% { box-shadow:0 0 16px rgba(233,196,106,.75); } }
  .ye-card:active .in { transform:scale(.94); }
  /* 뽑기 연출: 화면 가운데로 커지는 카드, 빛, 별가루 */
  .ye-stage { position:fixed; inset:0; z-index:2000; display:flex; align-items:center; justify-content:center; background:rgba(6,10,34,0); transition:background .5s; pointer-events:auto; }
  .ye-stage.on { background:rgba(6,10,34,.86); }
  .ye-stage.out { background:rgba(6,10,34,0); transition:background .6s, opacity .6s; opacity:0; }
  .ye-rays { position:absolute; width:520px; height:520px; border-radius:50%; background:repeating-conic-gradient(from 0deg, rgba(255,226,150,.22) 0 8deg, transparent 8deg 22deg); opacity:0; transform:scale(.3); transition:opacity .6s, transform 1.2s; animation:yeSpin 9s linear infinite; }
  .ye-stage.lit .ye-rays { opacity:1; transform:scale(1); }
  @keyframes yeSpin { to { rotate:360deg; } }
  .ye-big { position:relative; width:170px; height:238px; perspective:1000px; transform:scale(.4); opacity:0; transition:transform .6s cubic-bezier(.2,1.4,.4,1), opacity .3s; }
  .ye-stage.on .ye-big { transform:scale(1); opacity:1; }
  .ye-big .in { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .8s cubic-bezier(.3,1.3,.5,1); }
  .ye-big.wait .in { animation:yeWobble .55s ease-in-out infinite; }
  @keyframes yeWobble { 0%,100% { transform:rotate(-3deg) scale(1); } 50% { transform:rotate(3deg) scale(1.04); } }
  .ye-big.flip .in { transform:rotateY(180deg); animation:none; }
  .ye-big .f, .ye-big .b { position:absolute; inset:0; border-radius:16px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  .ye-big .f { background:linear-gradient(155deg,#17287e,#2540d8); border:3px solid #e9c46a; color:#ffe7a8; font-size:44px; box-shadow:0 0 34px rgba(233,196,106,.7); }
  .ye-big .b { transform:rotateY(180deg); background:linear-gradient(160deg,#fffaf0,#f6e3b4); border:3px solid #c9932f; color:#5a3c06; padding:14px; text-align:center; box-shadow:0 0 50px rgba(255,226,150,.9); }
  .ye-big .b small { font-size:12px; font-weight:800; letter-spacing:.04em; color:#a0741c; }
  .ye-big .b b { font-size:20px; font-weight:800; }
  .ye-spark { position:absolute; left:50%; top:50%; width:var(--s); height:var(--s); margin:calc(var(--s) / -2); border-radius:50%; background:radial-gradient(circle, #fff 0 25%, #ffe08a 45%, rgba(255,200,80,0) 72%); animation:yeBurst var(--d) cubic-bezier(.1,.7,.3,1) forwards; pointer-events:none; }
  .ye-spark.star { border-radius:0; background:none; color:#ffe08a; font-size:var(--s); width:auto; height:auto; margin:0; line-height:1; text-shadow:0 0 8px rgba(255,224,138,.9); }
  @keyframes yeBurst { 0% { transform:translate(0,0) scale(.3); opacity:1; } 70% { opacity:1; } 100% { transform:translate(var(--x), var(--y)) scale(1); opacity:0; } }
  .ye-tap { position:absolute; bottom:calc(48px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center; color:rgba(255,255,255,.8); font-size:14px; font-weight:700; }
  @media (prefers-reduced-motion: reduce) {
    .ye-rays, .ye-big.wait .in, .ye-deck .ye-card .f, .ye-spark { animation:none !important; }
  }

  .ye-label { display:inline-block; font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; background:#fbf3e0; color:#7a5310; }
  .ye-ref { font-size:15px; font-weight:800; color:var(--well); margin:12px 0 6px; }
  .ye-verse { font-size:18px; line-height:1.75; font-weight:800; color:var(--text); margin:0 0 10px; word-break:keep-all; }
  .ye-note { font-size:13.5px; color:var(--text-soft); line-height:1.7; margin:0 0 12px; }
  .ye-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .ye-btns > * { flex:1 1 140px; }
  .ye-msg { text-align:center; font-size:14px; color:var(--text-soft); }
  .ye-link { display:block; margin:12px auto 0; background:none; border:0; font-family:inherit; font-size:14px; font-weight:700; color:var(--well); min-height:40px; padding:6px 12px; cursor:pointer; }
  .ye-count { font-size:28px; font-weight:800; color:#17287e; display:block; margin:4px 0; }
</style>

<div class="wrap">

<script>
  initHeaderAuthState();
  (function () {
    var Y = YEAREND_YEAR, NEXT = Y + 1;
    var GUEST_KEY = "msu_yearend_pick_" + Y;
    var $ = function (id) { return document.getElementById(id); };
    var state = { user: null, review: null, staff: false, pick: null };

    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function kst() { var d = new Date(Date.now() + 9 * 3600e3); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
    // 화면에서도 같은 기간을 쓴다(서버 yearend_is_open과 같음). 관리자·부장은 서버가 미리 열어 준다.
    function openByDate() { var t = kst(); return t >= Date.UTC(Y, 11, 27) && t <= Date.UTC(NEXT, 0, 31); }

    function showClosed() {
      var left = Math.round((Date.UTC(Y, 11, 27) - kst()) / 86400000);
      var box = $("yeClosed");
      var ended = kst() > Date.UTC(NEXT, 0, 31);
      box.innerHTML = left > 0
        ? '<p class="ye-msg">12월 27일(주일)에 열려요<span class="ye-count">D-' + left + '</span>한 해 동안 말씀우물에서 함께한 기록을 돌아보고,<br>' + NEXT + '년을 여는 말씀카드 한 장을 뽑아요.</p>'
        : ended ? '<p class="ye-msg">' + Y + '년 말씀카드 뽑기는 1월 31일에 끝났어요.</p>'
        : '<p class="ye-msg">곧 열려요. 잠시 뒤 다시 열어 주세요.</p>';
      box.style.display = "block";
    }

    function stat(n, label, wide) {
      return '<div class="ye-stat' + (wide ? " wide" : "") + '"><b>' + n + '</b><span>' + label + '</span></div>';
    }
    function renderReview(r) {
      var box = $("yeReview");
      var j = r.joined ? new Date(r.joined + "T00:00:00") : null;
      var rows = [];
      if (r.attend) rows.push(stat(r.attend + "일", "출석한 날"));
      if (r.best_streak > 1) rows.push(stat(r.best_streak + "일", "가장 길게 이어 간 출석"));
      if (r.devotion) rows.push(stat(r.devotion + "일", "오늘의 QT 묵상"));
      if (r.memorize) rows.push(stat(r.memorize + "일", "말씀 외우기"));
      if (r.gratitude) rows.push(stat(r.gratitude + "개", "감사노트"));
      if (r.prayer) rows.push(stat(r.prayer + "개", "기도제목"));
      if (r.lines) rows.push(stat(r.lines + "번", "설교 한 줄"));
      if (r.odyssey) rows.push(stat(r.odyssey + "편", "In Odyssey 완료"));
      if (r.level) rows.push(stat("Lv." + r.level, "우물지기 레벨"));
      if (rows.length % 2 === 1) rows[rows.length - 1] = rows[rows.length - 1].replace('class="ye-stat"', 'class="ye-stat wide"');
      box.innerHTML =
        '<div class="ye-sec-title">' + esc(r.nickname || "나") + '님의 ' + Y + ' 말씀우물</div>' +
        '<p class="ye-sub">' + (j ? (j.getMonth() + 1) + '월 ' + j.getDate() + '일에 처음 함께했어요. ' : '') + '올 한 해 이렇게 말씀 곁에 있었어요.</p>' +
        (rows.length ? '<div class="ye-stats">' + rows.join("") + '</div>' : '<p class="ye-sub">아직 쌓인 기록이 많지 않아요. 새해에는 매일 한 걸음씩 함께해요.</p>');
      box.style.display = "block";
    }

    function renderDeck() {
      var box = $("yeDraw");
      var cards = "";
      for (var i = 0; i < 12; i++) cards += '<button type="button" class="ye-card" data-i="' + i + '" aria-label="카드 ' + (i + 1) + '"><span class="in"><span class="f">✦</span><span class="b">' + NEXT + '<br>말씀</span></span></button>';
      box.innerHTML =
        '<div class="ye-sec-title">' + NEXT + '년을 여는 말씀카드</div>' +
        '<p class="ye-sub">한 해를 지켜 주신 하나님께 감사하며 잠깐 기도해 보세요. 그리고 마음이 가는 카드 한 장을 골라 보세요.' +
        (state.user ? ' 한 사람이 한 장만 뽑을 수 있어요.' : ' <a href="login.html" style="color:var(--well);font-weight:700;">로그인</a>하면 한 해 기록도 함께 볼 수 있어요.') + '</p>' +
        '<div class="ye-deck shuffle" id="yeDeck">' + cards + '</div>' +
        '<p class="msg" id="yeDrawMsg" style="text-align:center;margin-top:10px;"></p>';
      box.style.display = "block";
      var deck = $("yeDeck"), busy = false;
      deck.addEventListener("click", function (e) {
        var c = e.target.closest(".ye-card");
        if (!c || busy) return;
        busy = true;
        $("yeDrawMsg").textContent = "카드를 펼치는 중...";
        draw().then(function (pick) {
          if (pick == null) { busy = false; return; }
          c.classList.add("flip");
          deck.classList.add("picking");
          $("yeDrawMsg").textContent = "";
          playReveal(pick, function () {
            $("yeDraw").style.display = "none";
            showResult(pick, true);
          });
        });
      });
    }

    // 뽑은 말씀마다 배경 사진을 하나로 정한다(다시 열어도, 저장한 카드도 같은 사진). 너무 어두운 사진은 뺀다.
    function bgNum(pick) {
      // 밝고 풍경이 잘 보이는 사진(71~85번: 11/4 밝은 배경 9장 + 가을 단풍 6장)만 쓴다.
      var bright = [71, 72, 73, 74, 75, 76, 77, 78, 79, 80, 81, 82, 83, 84, 85];
      return bright[(pick * 7 + 3) % bright.length];
    }
    function bgUrl(pick) { return "assets/verse-card-bg/verse-card-bg-" + String(bgNum(pick)).padStart(2, "0") + ".jpg"; }

    // 뽑기 연출. 고른 카드가 가운데로 커지고, 서버 응답을 기다리는 동안 흔들리다가, 별가루와 함께 뒤집힌다.
    function stage() {
      var el = document.createElement("div");
      el.className = "ye-stage";
      el.innerHTML = '<div class="ye-rays"></div><div class="ye-big wait"><span class="in"><span class="f">✦</span><span class="b"></span></span></div><div class="ye-tap">기도하는 마음으로 잠시 기다려 주세요</div>';
      document.body.appendChild(el);
      requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add("on"); }); });
      return el;
    }
    function burst(el) {
      var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var n = reduce ? 0 : 42;
      for (var i = 0; i < n; i++) {
        var s = document.createElement("span");
        var star = i % 3 === 0;
        s.className = "ye-spark" + (star ? " star" : "");
        if (star) s.textContent = i % 2 ? "✦" : "✧";
        var ang = Math.random() * Math.PI * 2, dist = 110 + Math.random() * 190;
        s.style.setProperty("--x", Math.round(Math.cos(ang) * dist) + "px");
        s.style.setProperty("--y", Math.round(Math.sin(ang) * dist) + "px");
        s.style.setProperty("--s", (star ? 14 + Math.random() * 14 : 6 + Math.random() * 10) + "px");
        s.style.setProperty("--d", (0.9 + Math.random() * 0.9) + "s");
        el.appendChild(s);
      }
      try { if (navigator.vibrate) navigator.vibrate([30, 60, 40]); } catch (e) {}
    }
    function playReveal(pick, done) {
      var el = stage();
      var v = YEAREND_VERSES[pick];
      // 배경 사진을 미리 받아 둔다.
      var img = new Image(); img.src = bgUrl(pick);
      var big = el.querySelector(".ye-big");
      el.querySelector(".b").innerHTML = '<small>' + NEXT + ' 나에게 주신 말씀</small><b>' + esc(v.ref) + '</b>';
      setTimeout(function () {
        big.classList.remove("wait");
        el.classList.add("lit");
        big.classList.add("flip");
        burst(el);
        el.querySelector(".ye-tap").textContent = "화면을 누르면 말씀이 펼쳐져요";
        var closed = false;
        function close() {
          if (closed) return; closed = true;
          el.classList.add("out");
          done();
          setTimeout(function () { el.remove(); }, 650);
        }
        el.addEventListener("click", close);
        setTimeout(close, 2600);
      }, 1200);
    }

    function draw() {
      if (!state.user) {
        var p = null;
        try { p = localStorage.getItem(GUEST_KEY); } catch (e) {}
        if (p == null || isNaN(Number(p))) {
          p = Math.floor(Math.random() * YEAREND_VERSES.length);
          try { localStorage.setItem(GUEST_KEY, String(p)); } catch (e) {}
        }
        return Promise.resolve(Number(p));
      }
      return getClient().rpc("draw_year_verse", { p_year: Y }).then(function (r) {
        if (r.error || !r.data || !r.data.ok) {
          $("yeDrawMsg").textContent = r.data && r.data.reason === "closed" ? "아직 뽑기가 열리지 않았어요." : "카드를 펼치지 못했어요. 잠시 뒤 다시 눌러 주세요.";
          return null;
        }
        return r.data.pick;
      }, function () { $("yeDrawMsg").textContent = "인터넷 연결을 확인하고 다시 눌러 주세요."; return null; });
    }

    function noteLine() {
      var r = state.review;
      var who = r && r.nickname ? r.nickname + "님에게 주신 " + NEXT + " 말씀" : NEXT + "년을 여는 말씀";
      var tail = [];
      if (r && r.attend) tail.push(Y + " 출석 " + r.attend + "일");
      if (r && r.devotion) tail.push("묵상 " + r.devotion + "일");
      return who + (tail.length ? " · " + tail.join(" · ") : "");
    }

    function showResult(pick, fresh) {
      state.pick = pick;
      var v = YEAREND_VERSES[pick];
      if (!v) return;
      if (!fresh) $("yeDraw").style.display = "none";
      var readHref = (typeof refToReadLink === "function" && refToReadLink(v.ref)) || "read.html";
      var box = $("yeResult");
      box.innerHTML =
        '<div class="ye-photo" style="background-image:url(' + bgUrl(pick) + ')">' +
          '<span class="ye-label">' + (fresh ? "🎁 내가 뽑은 " : "🎁 올해 뽑은 ") + NEXT + '년 말씀</span>' +
          '<div class="ye-ref">' + esc(v.ref) + '</div>' +
          '<p class="ye-verse">"' + esc(v.text) + '"</p>' +
          '<p class="ye-note">' + NEXT + '년 첫날부터 이 말씀을 붙들고 시작해요.<br>휴대폰 배경으로 저장해 두면 매일 볼 수 있어요.</p>' +
        '</div>' +
        '<div class="ye-actions">' +
        '<p style="font-size:12.5px;color:var(--text-soft);margin:0 0 6px;">저장할 크기를 골라 주세요</p>' +
        '<div class="tabs" id="yeSizePicker"></div>' +
        '<div class="ye-btns">' +
          '<button type="button" class="btn" id="yeSaveBtn">🖼️ 카드 저장</button>' +
          '<a class="btn ghost" href="' + readHref + '"' + (/^https?:/.test(readHref) ? ' target="_blank" rel="noopener"' : '') + '>📖 본문 읽기</a>' +
        '</div>' +
        '<button type="button" class="ye-link" id="yeShareBtn">💬 이 말씀 나누기</button>' +
        (state.staff ? '<button type="button" class="ye-link" id="yeResetBtn" style="margin-top:0;color:#a33;font-size:12.5px;">관리자 시험: 내 뽑기 지우고 다시 뽑기</button>' : '') +
        '<p class="msg" id="yeSaveMsg" style="text-align:center;margin-top:8px;"></p>' +
        '</div>';
      box.classList.toggle("reveal", !!fresh);
      box.style.display = "block";
      if (typeof initSizePicker === "function") initSizePicker("yeSizePicker", function () {}, "wallpaper");
      $("yeSaveBtn").onclick = function () { saveCard(v); };
      $("yeShareBtn").onclick = function () { share(v); };
      var rb = $("yeResetBtn");
      if (rb) rb.onclick = function () {
        getClient().rpc("reset_my_year_draw", { p_year: Y }).then(function () {
          try { localStorage.removeItem(GUEST_KEY); } catch (e) {}
          box.style.display = "none";
          renderDeck();
        });
      };
      if (fresh) setTimeout(function () { box.scrollIntoView({ behavior: "smooth", block: "start" }); }, 100);
    }

    function saveCard(v) {
      var msg = $("yeSaveMsg");
      var size = (typeof getSelectedSize === "function") ? getSelectedSize("yeSizePicker", "wallpaper") : { w: 1080, h: 2340 };
      msg.textContent = "카드를 만드는 중...";
      var bgLoad = new Promise(function (res) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { res(null); }; im.src = bgUrl(state.pick); });
      Promise.all([loadVerseCardFonts(), bgLoad]).then(function (r) {
        var canvas = $("yeCanvas");
        drawVerseCardImage(canvas, { ref: v.ref, text: v.text, note: noteLine() }, "yearend", size.w, size.h, r[1]);
        var a = document.createElement("a");
        a.download = "말씀우물_" + NEXT + "_말씀카드.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
        msg.textContent = "저장했어요. 사진첩이나 다운로드 폴더에서 볼 수 있어요.";
      }).catch(function () { msg.textContent = "카드를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요."; });
    }

    function share(v) {
      var text = "[" + NEXT + "년을 여는 말씀] " + v.ref + "\n\"" + v.text + "\"\n\n말씀우물에서 나도 한 장 뽑아 보기 👉 https://logoswell.kr/yearend.html";
      var msg = $("yeSaveMsg");
      if (navigator.share) { navigator.share({ text: text }).catch(function () {}); return; }
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () {
        msg.textContent = "말씀을 복사했어요. 카톡에 붙여 넣어 나눠 보세요.";
      }, function () { msg.textContent = "이 기기에서는 나누기를 쓸 수 없어요."; });
    }

    getSession().then(function (s) {
      state.user = s ? s.user : null;
      if (!state.user) {
        if (!openByDate()) { showClosed(); return; }
        var p = null;
        try { p = localStorage.getItem(GUEST_KEY); } catch (e) {}
        if (p != null && !isNaN(Number(p))) showResult(Number(p), false); else renderDeck();
        return;
      }
      return Promise.all([
        getClient().rpc("get_my_year_review", { p_year: Y }),
        getClient().from("profiles").select("is_admin, is_department_head").eq("user_id", state.user.id).single()
      ]).then(function (res) {
        var r = res[0].data, p = res[1].data;
        state.staff = !!(p && (p.is_admin || p.is_department_head));
        if (!r || !r.ok) { $("yeClosed").innerHTML = '<p class="ye-msg">기록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p>'; $("yeClosed").style.display = "block"; return; }
        state.review = r;
        if (!r.open) { showClosed(); return; }
        if (state.staff && !openByDate()) { $("yeClosed").innerHTML = '<p class="ye-msg">👀 관리자 미리보기예요. 다른 사람에게는 12월 27일에 열려요.</p>'; $("yeClosed").style.display = "block"; }
        renderReview(r);
        if (r.pick != null) showResult(r.pick, false); else renderDeck();
      });
    }).catch(function () {
      $("yeClosed").innerHTML = '<p class="ye-msg">화면을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>';
      $("yeClosed").style.display = "block";
    });
  })();
</script>
<script src="assets/appshell.js"></script>
</body>
</html>
