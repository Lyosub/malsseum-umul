<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>별 밝히기 | 관리</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  [hidden] { display: none !important; }
  :root {
    --bg: #0d1228; --panel: #161d3d; --ink: #eef0fb; --dim: #9aa1c7; --line: rgba(238,240,251,.12);
    --gold: #f5d27a; --ok: #7fd6a4; --warn: #ffcf70; --bad: #ff9b8f;
    --sans: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5;
         padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(30px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 20px; margin: 0; } h2 { font-size: 15px; margin: 0; color: var(--gold); letter-spacing: .04em; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
  button, select, input { font: inherit; color: var(--ink); background: #0b1022; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  button.on { background: var(--gold); color: #241a02; border-color: var(--gold); font-weight: 700; }
  button.primary { background: var(--gold); color: #241a02; font-weight: 700; border: 0; }
  button.danger { color: var(--bad); border-color: rgba(255,155,143,.4); }
  .state-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .state-grid button { padding: 12px 8px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--dim); }
  .pill.pending { color: var(--warn); } .pill.approved { color: var(--ok); } .pill.hidden, .pill.blocked { color: var(--bad); }
  .list { display: grid; gap: 8px; max-height: 52vh; overflow: auto; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; }
  .item .b { font-size: 16px; word-break: keep-all; overflow-wrap: anywhere; }
  .item .m { font-size: 12.5px; color: var(--dim); }
  .win { border-color: var(--gold); }
  .muted { color: var(--dim); font-size: 13px; }
  .stat { font-variant-numeric: tabular-nums; }
  #login { max-width: 360px; margin: 18vh auto 0; }
  #confirmBox { border-color: var(--bad); }
  a { color: var(--gold); }
  details summary { cursor: pointer; color: var(--dim); }
</style>
</head>
<body>
<main>
  <section class="panel" id="login">
    <h1>별 밝히기 관리</h1>
    <p class="muted">관리 코드를 넣어 주세요. 이 휴대폰에 기억해 둡니다.</p>
    <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="숫자 6자리" autocomplete="off">
    <button class="primary" id="enter" type="button">들어가기</button>
    <div class="muted" id="loginMsg" role="status"></div>
  </section>

  <div id="app" hidden style="display:grid;gap:14px">
    <div class="row" style="justify-content:space-between">
      <h1>별 밝히기 관리</h1>
      <span class="muted stat" id="stats"></span>
    </div>

    <section class="panel">
      <h2>본당 화면</h2>
      <div class="state-grid">
        <button type="button" data-state="empty">① 빈 하늘</button>
        <button type="button" data-state="stage">② 무대</button>
        <button type="button" data-state="cheer">③ 응원의 시간</button>
        <button type="button" data-state="gather">④ 별이 모이는 시간</button>
      </div>
      <div class="row">
        <label class="muted" for="dept">무대 부서</label>
        <select id="dept">
          <option>영어예배부</option><option>영아부</option><option>유아부</option><option>유치부</option>
          <option>유년부</option><option>초등부</option><option>중등부</option><option>고등부</option>
        </select>
        <button type="button" id="nextDept">다음 부서 무대로</button>
      </div>
    </section>

    <section class="panel">
      <div class="row" style="justify-content:space-between">
        <h2>승인 대기 <span class="stat" id="pendingCount">0</span></h2>
        <button class="primary" type="button" id="approveAll">모두 승인</button>
      </div>
      <div class="list" id="pendingList"></div>
    </section>

    <section class="panel">
      <h2>⑤ 별 추첨</h2>
      <div class="row">
        <button class="primary" type="button" id="draw">추첨하기</button>
        <button type="button" id="redraw">자리에 없음 · 다시 추첨</button>
        <label class="row muted" style="gap:6px"><input type="checkbox" id="noDupe"> 같은 부서 중복 당첨 막기</label>
      </div>
      <div class="muted" id="drawMsg" role="status"></div>
      <div class="list" id="winners"></div>
    </section>

    <section class="panel">
      <h2>화면에 뜬 응원 <span class="stat" id="approvedCount">0</span></h2>
      <div class="list" id="approvedList"></div>
      <details><summary>걸러진·숨긴 응원 <span id="otherCount">0</span></summary><div class="list" id="otherList" style="margin-top:8px"></div></details>
    </section>

    <section class="panel">
      <h2>설정</h2>
      <div class="row">
        <label class="row muted" style="gap:6px"><input type="checkbox" id="open"> 응원 받기</label>
        <label class="row muted" style="gap:6px"><input type="checkbox" id="testMode"> 시험 모드(새 응원을 「시험」으로 저장)</label>
      </div>
      <div class="row">
        <button type="button" id="clearTest">시험 응원 지우기</button>
        <button type="button" class="danger" id="reset">시연 처음부터</button>
      </div>
      <div class="panel" id="confirmBox" hidden>
        <div>미리 받은 응원만 남기고 오늘 보낸 응원과 추첨 결과를 모두 지웁니다. 계속할까요?</div>
        <div class="row"><button type="button" class="danger" id="resetYes">지우기</button><button type="button" id="resetNo">취소</button></div>
      </div>
      <div class="muted">
        하늘 화면: <a id="skyLink" target="_blank" rel="noopener"></a><br>
        보내기 화면: <a id="sendLink" target="_blank" rel="noopener"></a>
      </div>
    </section>
  </div>
</main>

<script src="assets/supabase-config.js"></script>
<script src="assets/vendor/supabase-js.js"></script>
<script>
(function () {
  var ROOM = (location.hash || '').replace('#', '') || 'demo';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'star_admin_code_' + ROOM, code = '';
  try { code = localStorage.getItem(KEY) || ''; } catch (e) {}
  var DEPTS = ['영어예배부','영아부','유아부','유치부','유년부','초등부','중등부','고등부'];
  var base = location.origin + location.pathname.replace(/star-admin\.html$/, '');
  var tail = ROOM === 'demo' ? '' : '#' + ROOM;
  $('skyLink').href = $('skyLink').textContent = base + 'star-sky.html' + tail;
  $('sendLink').href = $('sendLink').textContent = base + 'star.html' + tail;

  function call(action, args) {
    return sb.rpc('star_admin', { p_room: ROOM, p_code: code, p_action: action, p_args: args || {} })
      .then(function (r) { if (r.error) throw r.error; return r.data || {}; });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  $('enter').onclick = function () {
    code = $('code').value.replace(/\D/g, '');
    call('list').then(function (d) {
      if (!d.ok) { $('loginMsg').textContent = d.error; return; }
      try { localStorage.setItem(KEY, code); } catch (e) {}
      start(d);
    }).catch(function () { $('loginMsg').textContent = '연결하지 못했습니다. 잠시 뒤 다시 눌러 주세요.'; });
  };
  if (code) call('list').then(function (d) { if (d.ok) start(d); }).catch(function () {});

  var timer = 0;
  function start(d) { $('login').hidden = true; $('app').hidden = false; render(d); clearTimeout(timer); timer = setTimeout(refresh, 2000); }
  function refresh() {
    call('list').then(function (d) { if (d.ok) render(d); }).catch(function () {})
      .then(function () { clearTimeout(timer); timer = setTimeout(refresh, 2000); });
  }
  function act(action, args) { return call(action, args).then(function (d) { if (!d.ok && d.error) $('drawMsg').textContent = d.error; return call('list'); }).then(function (d) { if (d.ok) render(d); }); }

  function item(m, buttons) {
    var kind = m.kind === 'pre' ? ' · 미리 보냄' : m.kind === 'test' ? ' · 시험' : '';
    return '<div class="item' + (m.won ? ' win' : '') + '"><div class="b">' + esc(m.body) + '</div>' +
      '<div class="m">' + esc(m.name) + (m.show_name ? '' : '(화면엔 「한 성도」)') + ' · ' + esc(m.dept) + kind + (m.won ? ' · ⭐ 당첨' : '') + '</div>' +
      '<div class="row">' + buttons + '</div></div>';
  }
  function render(d) {
    var room = d.room, ms = d.messages || [];
    document.querySelectorAll('[data-state]').forEach(function (b) { b.classList.toggle('on', b.dataset.state === room.state); });
    $('stats').textContent = '지금: ' + ({ empty: '빈 하늘', stage: '무대 · ' + room.stage_label, cheer: '응원의 시간', gather: '별이 모이는 시간', draw: '별 추첨' }[room.state] || room.state);
    if (room.stage_label && DEPTS.indexOf(room.stage_label) >= 0 && document.activeElement !== $('dept')) $('dept').value = room.stage_label;
    $('noDupe').checked = room.no_dupe_dept; $('testMode').checked = room.test_mode; $('open').checked = room.open;

    var pend = ms.filter(function (m) { return m.status === 'pending'; }).reverse();
    var appr = ms.filter(function (m) { return m.status === 'approved'; });
    var other = ms.filter(function (m) { return m.status === 'hidden' || m.status === 'blocked'; });
    $('pendingCount').textContent = pend.length; $('approvedCount').textContent = appr.length; $('otherCount').textContent = other.length;
    $('pendingList').innerHTML = pend.length ? pend.map(function (m) {
      return item(m, '<button class="primary" data-a="approve" data-id="' + m.id + '">승인</button><button data-a="hide" data-id="' + m.id + '">숨기기</button>');
    }).join('') : '<div class="muted">승인할 응원이 없습니다.</div>';
    $('approvedList').innerHTML = appr.map(function (m) { return item(m, '<button class="danger" data-a="hide" data-id="' + m.id + '">숨기기</button>'); }).join('') || '<div class="muted">아직 없습니다.</div>';
    $('otherList').innerHTML = other.map(function (m) {
      return item(m, '<span class="pill ' + m.status + '">' + (m.status === 'blocked' ? '금칙어로 걸러짐' : '숨김') + '</span><button data-a="approve" data-id="' + m.id + '">다시 승인</button>');
    }).join('') || '<div class="muted">없습니다.</div>';
    $('winners').innerHTML = (d.winners || []).map(function (w, i) {
      return '<div class="item win"><div class="b">' + (i + 1) + '. ' + esc(w.dept) + ' 당첨</div><div class="m">「' + esc(w.body) + '」 — ' + esc(w.name) + '</div></div>';
    }).join('');
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a) act(b.dataset.a, { id: +b.dataset.id });
    if (b.dataset.state) act('state', { state: b.dataset.state, label: b.dataset.state === 'stage' ? $('dept').value : undefined });
  });
  $('nextDept').onclick = function () {
    var i = DEPTS.indexOf($('dept').value); $('dept').value = DEPTS[Math.min(DEPTS.length - 1, i + 1)];
    act('state', { state: 'stage', label: $('dept').value });
  };
  $('approveAll').onclick = function () { act('approve_all'); };
  $('draw').onclick = function () { $('drawMsg').textContent = ''; act('draw'); };
  $('redraw').onclick = function () { $('drawMsg').textContent = ''; act('redraw'); };
  $('noDupe').onchange = function () { act('set', { no_dupe_dept: this.checked }); };
  $('testMode').onchange = function () { act('set', { test_mode: this.checked }); };
  $('open').onchange = function () { act('set', { open: this.checked }); };
  $('clearTest').onclick = function () { act('clear_test'); };
  $('reset').onclick = function () { $('confirmBox').hidden = false; };
  $('resetNo').onclick = function () { $('confirmBox').hidden = true; };
  $('resetYes').onclick = function () { $('confirmBox').hidden = true; act('reset'); };
})();
</script>
</body>
</html>
