<style>
  .cl-tabs { display:flex; gap:8px; margin:0 0 14px; }
  .cl-tabs button { flex:1; padding:11px 8px; border-radius:12px; border:2px solid var(--well); background:#fff; color:var(--well-deep); font:inherit; font-weight:800; font-size:15px; cursor:pointer; }
  .cl-tabs button[aria-pressed="true"] { background:var(--well); color:#fff; }
  .cl-count { margin:0 0 6px; font-size:15px; color:var(--well-deep); }
  .cl-count b { font-size:24px; }
  .cl-group { margin:18px 0 8px; font-weight:800; font-size:14px; color:var(--well-deep); }
  .cl-stamps { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .cl-stamp { border:2px dashed #c9cfdb; border-radius:14px; padding:10px 4px 8px; text-align:center; background:#fff; color:#8a93a3; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; }
  .cl-stamp b { font-size:12px; line-height:1.25; word-break:keep-all; }
  .cl-stamp small { font-size:11px; }
  .cl-se { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; background:#eef0f5; }
  .cl-stamp.got { border:2px solid #d9534f; color:#b3322e; background:#fff7f6; }
  .cl-stamp.got .cl-se { background:#ffe3e0; box-shadow:inset 0 0 0 2px #d9534f; transform:rotate(-8deg); }
  .cl-cards { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .cl-card { position:relative; border:2px solid var(--era, #9aa3b5); border-radius:14px; background:#fff; padding:22px 6px 9px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; overflow:hidden; }
  .cl-card b { font-size:14px; color:#1d2433; }
  .cl-card small { font-size:10.5px; line-height:1.3; color:#5d6676; word-break:keep-all; }
  .cl-era { position:absolute; top:0; left:0; right:0; font-size:10px; font-weight:700; color:#fff; background:var(--era); padding:2px 0; }
  .cl-face { width:44px; height:44px; border-radius:50%; background:var(--era, #c9cfdb); color:#fff; font-weight:800; font-size:22px; display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .cl-card.unk { border-style:dashed; border-color:#c9cfdb; padding-top:12px; }
  .cl-card.unk b { color:#8a93a3; letter-spacing:2px; } .cl-card.unk .cl-face { background:#e4e7ee; color:#9aa3b5; }
  .cl-card.f1 { border-color:#8f9bb0; box-shadow:0 0 0 2px #dfe5ee, 0 4px 10px rgba(80,95,120,.25); }
  .cl-card.f2 { border-color:#c9932f; box-shadow:0 0 0 2px #f6dc9a, 0 4px 12px rgba(201,147,47,.35); background:linear-gradient(180deg,#fffaf0,#fff); }
  .cl-n, .cl-f { position:absolute; font-style:normal; font-size:10px; font-weight:800; padding:1px 5px; border-radius:8px; }
  .cl-n { right:4px; top:20px; background:#eef0f5; color:#4a5568; }
  .cl-f { left:4px; top:20px; background:#f6dc9a; color:#7a5510; } .cl-card.f1 .cl-f { background:#dfe5ee; color:#4a5568; }
  .cl-card.new { animation:clPop .5s ease both; }
  @keyframes clPop { from { transform:scale(.6) rotate(-6deg); opacity:0; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .cl-card.new { animation:none; } }
  @media (min-width:560px) { .cl-stamps { grid-template-columns:repeat(6, 1fr); } .cl-cards { grid-template-columns:repeat(5, 1fr); } }
</style>
