  <button id="downloadWeeklyBtn" class="btn block">📸 말씀 카드 저장하기</button>
  <canvas id="weeklyCardCanvas" style="display:none;"></canvas>

  <p class="msg" style="text-align:center;">이번 주 예배 말씀의 핵심만 간단히 정리했어요.</p>
