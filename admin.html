<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>관리자 | 말씀우물</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">💧 말씀우물</a>
  <nav>
    <a href="mypage.html">마이페이지</a>
  </nav>
</header>
<div class="wrap">
  <section class="hero">
    <h1>관리자</h1>
    <p>공지사항과 이달의 일정을 관리하세요</p>
  </section>

  <div class="auth-gate" id="adminGate"></div>

  <div id="adminContent" style="display:none;">
    <div class="card">
      <h3 style="margin-top:0;">공지사항 작성</h3>
      <form id="announcementForm">
        <div class="form-row">
          <label for="announcementTitle">제목</label>
          <input type="text" id="announcementTitle" placeholder="공지 제목">
        </div>
        <div class="form-row">
          <label for="announcementContent">내용</label>
          <textarea id="announcementContent" placeholder="공지 내용"></textarea>
        </div>
        <button type="submit" class="btn block">공지 등록</button>
        <p class="msg" id="announcementMsg"></p>
      </form>
      <hr class="well-divider">
      <div id="announcementAdminList"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">이달의 일정 추가</h3>
      <form id="eventForm">
        <div class="form-row">
          <label for="eventDate">날짜</label>
          <input type="date" id="eventDate">
        </div>
        <div class="form-row">
          <label for="eventTitle">제목</label>
          <input type="text" id="eventTitle" placeholder="일정 제목">
        </div>
        <div class="form-row">
          <label for="eventDescription">설명 (선택)</label>
          <textarea id="eventDescription" placeholder="일정 설명"></textarea>
        </div>
        <button type="submit" class="btn block">일정 등록</button>
        <p class="msg" id="eventMsg"></p>
      </form>
      <hr class="well-divider">
      <div id="eventAdminList"></div>
    </div>
  </div>
</div>
<footer class="site">💧 말씀우물</footer>
<script src="assets/supabase-config.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
<script src="assets/admin.js"></script>
<script>
  initAdminPage();
</script>
</body>
</html>
