<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; }
  body { font-family:'Pretendard','Malgun Gothic',sans-serif; }
  .card {
    width:1080px; height:1350px; position:relative; overflow:hidden;
    color:#fff; padding:76px 72px 56px;
    background:linear-gradient(163deg,#141f6b 0%,#2540d8 58%,#3f5bec 100%);
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .card::after { content:""; position:absolute; right:-200px; bottom:-180px; width:560px; height:560px; border-radius:50%; background:rgba(255,255,255,.06); }
  .card::before { content:""; position:absolute; left:-140px; top:-120px; width:400px; height:400px; border-radius:50%; background:rgba(205,236,55,.10); }
  .kicker { font-size:26px; font-weight:700; letter-spacing:2px; background:rgba(255,255,255,.16); padding:13px 30px; border-radius:999px; position:relative; z-index:1; }
  .mascot { width:360px; height:360px; object-fit:contain; margin:40px 0 18px; position:relative; z-index:1; filter:drop-shadow(0 20px 40px rgba(0,0,0,.25)); }
  h1 { font-size:66px; font-weight:800; line-height:1.2; letter-spacing:-2px; margin:0 0 18px; position:relative; z-index:1; }
  .lead { font-size:30px; font-weight:500; color:rgba(255,255,255,.86); line-height:1.5; max-width:800px; margin-bottom:40px; position:relative; z-index:1; }
  .cta { position:relative; z-index:1; background:#cdec37; color:#1b2a05; border-radius:20px; padding:30px 46px; font-size:40px; font-weight:800; letter-spacing:-1px; }
  .cta span { display:block; font-size:24px; font-weight:600; color:#33420a; margin-top:8px; }
  .foot { margin-top:auto; position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; width:100%; padding-top:22px; }
  .foot .n { font-size:26px; font-weight:700; color:rgba(255,255,255,.72); }
  .foot .site { font-size:26px; font-weight:800; color:#cdec37; }
</style></head>
