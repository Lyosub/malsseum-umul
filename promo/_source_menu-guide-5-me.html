<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; }
  body { font-family:'Pretendard','Malgun Gothic',sans-serif; }
  .card {
    width:1080px; height:1350px; position:relative; overflow:hidden;
    color:#fff; padding:72px 72px 56px;
    background:linear-gradient(163deg,#141f6b 0%,#2540d8 58%,#3f5bec 100%);
    display:flex; flex-direction:column;
  }
  .card::after { content:""; position:absolute; right:-200px; bottom:-180px; width:560px; height:560px; border-radius:50%; background:rgba(255,255,255,.06); }
  .card::before { content:""; position:absolute; left:-140px; top:-120px; width:400px; height:400px; border-radius:50%; background:rgba(205,236,55,.10); }
  .kicker { align-self:flex-start; font-size:24px; font-weight:700; letter-spacing:2px; background:rgba(255,255,255,.16); padding:11px 26px; border-radius:999px; position:relative; z-index:1; }
  h1 { font-size:76px; font-weight:800; line-height:1.14; letter-spacing:-2px; margin:26px 0 10px; position:relative; z-index:1; }
  .lead { font-size:31px; font-weight:500; color:rgba(255,255,255,.85); margin-bottom:40px; line-height:1.4; position:relative; z-index:1; }
  .box { background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16); border-radius:24px; padding:28px 32px; position:relative; z-index:1; }
  .row { display:flex; gap:18px; align-items:flex-start; }
  .row + .row { margin-top:20px; padding-top:20px; border-top:1px solid rgba(255,255,255,.14); }
  .row .e { font-size:40px; line-height:1.15; flex:0 0 auto; }
  .row .t b { display:block; font-size:31px; font-weight:800; letter-spacing:-.5px; margin-bottom:5px; }
  .row .t span { font-size:25px; font-weight:400; color:rgba(255,255,255,.82); line-height:1.42; }
  .foot { margin-top:auto; position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; padding-top:22px; }
  .foot .n { font-size:25px; font-weight:700; color:rgba(255,255,255,.7); }
  .foot .site { font-size:25px; font-weight:800; color:#cdec37; }
</style></head>
<body>
<div class="card">
  <div class="kicker">STEP 4 · 하단 탭</div>
  <h1>📝 나의 기록</h1>
  <div class="lead">오늘의 나를 남겨두는 곳</div>
  <div class="box">
    <div class="row"><span class="e">✍️</span><div class="t"><b>하루 인사 · 감사 노트 · 기도 제목</b><span>매일 한 줄씩, 쓰기 버튼 눌러 바로 작성</span></div></div>
    <div class="row"><span class="e">💬</span><div class="t"><b>자유게시판</b><span>서로의 글에 댓글로 마음을 나눠요</span></div></div>
    <div class="row"><span class="e">📚</span><div class="t"><b>지난 기록</b><span>내가 써온 글들을 날짜별로 모아보기</span></div></div>
    <div class="row"><span class="e">🏅</span><div class="t"><b>나의 뱃지</b><span>개근왕 · 기록왕 · 기도친구 등, 꾸준함이 쌓이면 뱃지로</span></div></div>
  </div>
  <div class="foot"><span class="n">5 / 7</span><span class="site">logoswell.kr</span></div>
</div>
</body></html>
