<script src="assets/word-cards-data.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/script.js"></script>
<script>
  initHeaderAuthState();
  (function () {
    var list = document.getElementById("wcList");
    if (!list || typeof WORD_CARDS === "undefined") return;
    WORD_CARDS.forEach(function (c) {
      var d = new Date(c.date + "T00:00:00");
      var dateLabel = d.getFullYear() + "." + ("0" + (d.getMonth() + 1)).slice(-2) + "." + ("0" + d.getDate()).slice(-2);
      var el = document.createElement("a");
      el.href = c.img;
      el.target = "_blank";
      el.rel = "noopener";
      el.style.textDecoration = "none";
      el.className = "card wc-card";
      el.innerHTML =
        '<img src="' + c.img + '" alt="' + c.word + '" loading="lazy">' +
        '<div class="wc-meta">' +
          '<div class="wc-word">' + c.word + ' · ' + c.sermonTitle + '</div>' +
          '<div class="wc-sub">' + c.ref + ' · ' + dateLabel + ' 중등부 예배</div>' +
        '</div>';
      list.appendChild(el);
    });
  })();
</script>
<script src="assets/appshell.js"></script>
</body>
