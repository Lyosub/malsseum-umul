<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>성경 O/X 스피드퀴즈 | 말씀우물</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2540d8">
<link rel="apple-touch-icon" href="assets/icons/icon-512.png">
<script defer src="assets/pwa.js"></script>
<style>
  .ox-timer-bar { height: 10px; border-radius: 999px; background: var(--border); overflow: hidden; margin: 10px 0 2px; }
  .ox-timer-fill { height: 100%; background: linear-gradient(90deg, var(--well-light) 0%, var(--well) 100%); width: 100%; }
  .ox-statement { font-size: 18px; font-weight: 700; color: var(--well-deep); text-align: center; line-height: 1.6; margin: 18px 0 20px; min-height: 70px; display: flex; align-items: center; justify-content: center; }
  .ox-btn-row { display: flex; gap: 12px; }
  .ox-btn { flex: 1 1 0; padding: 26px 0; border-radius: 18px; border: 0; font-size: 32px; font-weight: 900; cursor: pointer; }
  .ox-btn-o { background: rgba(37, 64, 216, 0.12); color: var(--well); }
  .ox-btn-x { background: rgba(179, 67, 44, 0.12); color: #b3432c; }
  .ox-btn:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">💧 말씀우물</a>
  <nav><a href="play.html">말씀놀이터</a></nav>
</header>
<div class="wrap">
  <div class="page-hd">
    <h1>⭕❌ 성경 O/X 스피드퀴즈</h1>
    <p>문장을 보고 7초 안에 O/X를 골라요. 열 문제!</p>
  </div>

  <div class="card tint-blue">
    <p class="msg" style="margin:0;">💠 <strong>달란트 얻는 법</strong> — 열 문제를 다 풀면 <strong style="color:var(--well);">+2달란트</strong> (하루 1번). 로그인해야 저장돼요.</p>
  </div>

  <div class="card" id="oxStartCard" style="text-align:center;">
    <p class="msg" style="margin-top:0;">준비됐으면 시작을 눌러요. 문제마다 7초예요!</p>
    <button type="button" id="oxStartBtn" class="btn block">시작하기</button>
  </div>

  <div class="card" id="oxPlayCard" style="display:none;">
    <p class="msg" id="oxProgress" style="margin-top:0;text-align:center;"></p>
    <div class="ox-timer-bar"><div class="ox-timer-fill" id="oxTimerFill"></div></div>
    <div class="ox-statement" id="oxStatement"></div>
    <div class="ox-btn-row">
      <button type="button" id="oxBtnO" class="ox-btn ox-btn-o">O</button>
      <button type="button" id="oxBtnX" class="ox-btn ox-btn-x">X</button>
    </div>
    <p class="msg" id="oxFeedback" style="text-align:center;margin-top:14px;min-height:20px;"></p>
  </div>

  <div class="card" id="oxDoneCard" style="display:none;text-align:center;">
    <h3 style="margin-top:0;">🎉 끝!</h3>
    <p style="font-size:26px;font-weight:800;color:var(--well-deep);margin:6px 0;" id="oxScore"></p>
    <p class="msg" id="oxDoneMsg" style="font-weight:700;color:var(--well);"></p>
    <button type="button" id="oxAgainBtn" class="btn ghost" style="margin-top:8px;padding:8px 18px;font-size:12.5px;">다시 풀기</button>
    <a href="play.html" class="btn block" style="margin-top:10px;">말씀놀이터로</a>
  </div>
</div>
<footer class="site">
  <img src="assets/logos/logos-color.png" alt="로고스교회 로고" style="width:34px;height:34px;object-fit:contain;">
  <p style="margin:6px 0 10px;color:var(--well-deep);font-weight:600;font-size:12.5px;">100명의 훈련된 예수 제자를 세워가는 로고스교회 중등부</p>
  💧 말씀우물
</footer>
<script src="assets/ox-quiz-data.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/ox-game.js"></script>
<script src="assets/appshell.js"></script>
<script>initOxGame();</script>
</body>
</html>
