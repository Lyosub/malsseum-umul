<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>달란트 상점 | 말씀우물</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2540d8">
<link rel="apple-touch-icon" href="assets/icons/icon-512.png">
<script defer src="assets/pwa.js"></script>
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">💧 말씀우물</a>
  <nav>
    <a href="login.html" id="navLogin">로그인</a>
    <a href="mypage.html" id="navMypage" style="display:none;">마이페이지</a>
  </nav>
</header>
<div class="wrap">
  <div class="page-hd">
    <h1>🎁 달란트 상점</h1>
    <p>모은 달란트로 상품을 교환 신청해요. 교역자·부장 선생님이 확인 후 전달해 줍니다.</p>
  </div>

  <div class="card" style="text-align:center;">
    <div class="label" style="color:var(--text-soft);font-size:13px;">쓸 수 있는 달란트</div>
    <div id="shopBalance" style="font-size:34px;font-weight:800;color:var(--well-deep);">–</div>
  </div>

  <div id="shopGate"></div>

  <div class="card">
    <div class="well-label" style="margin-top:0;">교환할 수 있는 상품</div>
    <p class="msg" style="margin:0 0 10px;">※ 달란트 가격은 상황에 따라 오르거나 내려갈 수 있어요.</p>
    <div id="shopItems"><p class="msg">불러오는 중...</p></div>
  </div>

  <div class="card">
    <div class="well-label" style="margin-top:0;">내 교환 내역</div>
    <div id="shopOrders"><p class="msg">불러오는 중...</p></div>
  </div>

  <div class="card" id="shopSuggestCard">
    <div class="well-label" style="margin-top:0;">🛒 상품 추천함</div>
    <p class="msg" style="margin:0 0 12px;">"이런 상품 있으면 좋겠어요!"를 적어서 보내주세요. 선생님이 확인해요.</p>
    <form id="shopSuggestForm">
      <div class="form-row">
        <textarea id="shopSuggestInput" placeholder="예: 스타벅스 기프티콘, 떡볶이 교환권 …" rows="2"></textarea>
      </div>
      <button type="submit" class="btn block">추천 보내기</button>
      <p class="msg" id="shopSuggestMsg"></p>
    </form>
    <div id="shopMySuggestions" style="margin-top:12px;"></div>
  </div>
</div>
<footer class="site">
  <img src="assets/logos/logos-color.png" alt="로고스교회 로고" style="width:34px;height:34px;object-fit:contain;">
  <p style="margin:6px 0 10px;color:var(--well-deep);font-weight:600;font-size:12.5px;">100명의 훈련된 예수 제자를 세워가는 로고스교회 중등부</p>
  💧 말씀우물 · <a href="about.html">소개</a> · <a href="privacy.html">개인정보처리방침</a>
</footer>
<script src="assets/supabase-config.js"></script>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/shop.js"></script>
<script>
  initShopPage();
  initHeaderAuthState();
</script>
<script src="assets/appshell.js"></script>
</body>
</html>
