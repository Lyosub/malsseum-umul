<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>마이페이지 | 말씀우물</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">💧 말씀우물</a>
  <nav>
    <a href="#" id="logoutBtn">로그아웃</a>
  </nav>
</header>
<div class="wrap" id="pageContent" style="display:none;">
  <section class="hero">
    <h1>나의 기록</h1>
    <p>출석과 하루의 마음을 남겨보세요</p>
  </section>

  <div class="card streak">
    <div class="num" id="streakNum">0</div>
    <div class="label">일 연속 출석</div>
    <button id="checkinBtn" class="btn" style="margin-top:14px;">오늘 출석 체크하기</button>
    <p class="msg" id="streakMsg"></p>
  </div>

  <div class="card">
    <div class="pill-toggle">
      <button data-type="greeting" class="active">하루 인사</button>
      <button data-type="gratitude">감사노트</button>
      <button data-type="prayer">기도제목</button>
    </div>
    <form id="noteForm">
      <input type="hidden" id="noteType" value="greeting">
      <div class="form-row">
        <textarea id="contentInput" placeholder="오늘 하루 인사, 감사한 일, 기도하고 싶은 제목을 자유롭게 적어보세요"></textarea>
      </div>
      <button type="submit" class="btn block">기록하기</button>
      <p class="msg" id="formMsg"></p>
    </form>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">지난 기록</h3>
    <div id="noteList"></div>
  </div>

  <div class="card" id="groupSection">
    <h3 style="margin-top:0;">우리 그룹</h3>
    <p class="msg" id="groupMsg"></p>

    <div id="groupNone" style="display:none;">
      <p style="color:var(--text-soft);font-size:13.5px;">친구들과 그룹을 만들거나, 초대받은 코드로 참여해서 함께 출석해보세요.</p>
      <form id="createGroupForm" style="margin-bottom:16px;">
        <div class="form-row">
          <label for="groupNameInput">새 그룹 만들기</label>
          <input type="text" id="groupNameInput" placeholder="예: 중등부 3반">
        </div>
        <button type="submit" class="btn block">그룹 만들기</button>
      </form>
      <form id="joinGroupForm">
        <div class="form-row">
          <label for="joinCodeInput">초대 코드로 참여하기</label>
          <input type="text" id="joinCodeInput" placeholder="6자리 코드 입력">
        </div>
        <button type="submit" class="btn ghost block">참여하기</button>
      </form>
    </div>

    <div id="groupHas" style="display:none;">
      <p style="margin:0 0 4px;font-weight:700;" id="groupName"></p>
      <p style="color:var(--text-soft);font-size:13px;margin-top:0;">초대 코드: <strong id="groupCode" style="color:var(--well);"></strong> (친구에게 공유해보세요)</p>
      <div id="leaderboardList" style="margin-top:14px;"></div>
    </div>
  </div>
</div>

<div class="wrap auth-gate" id="loginGate">
  <p>로그인이 필요한 페이지예요.</p>
  <a href="login.html" class="btn">로그인하러 가기</a>
</div>

<footer class="site">💧 말씀우물 · <a href="about.html">소개</a> · <a href="privacy.html">개인정보처리방침</a></footer>
<script src="assets/supabase-config.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
<script src="assets/mypage.js"></script>
<script>
  initLogoutButton();
  getSession().then(function (session) {
    if (!session) {
      document.getElementById("loginGate").style.display = "block";
      return;
    }
    document.getElementById("loginGate").style.display = "none";
    document.getElementById("pageContent").style.display = "block";
    ensureProfile(session).then(function () {
      initAttendance(session.user.id);
      initNotes(session.user.id);
      initGroup(session.user.id);
    });
  });
</script>
</body>
</html>
