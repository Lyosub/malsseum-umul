<style>
  .qr-code { font-size:clamp(44px, 14vw, 120px); font-weight:800; letter-spacing:.12em; color:var(--well-deep); text-align:center; line-height:1.1; }
  .qr-join { display:flex; gap:16px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .qr-join img { width:150px; height:150px; border:1px solid #d9deea; border-radius:10px; background:#fff; }
  .qr-people { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .qr-people button, .qr-people span { border:1.5px solid var(--well); background:#fff; color:var(--well-deep); border-radius:999px; padding:6px 12px; font:inherit; font-weight:700; font-size:14px; }
  .qr-people button { cursor:pointer; }
  .qr-q { font-size:clamp(19px, 4.6vw, 34px); font-weight:800; color:#1d2433; line-height:1.4; word-break:keep-all; text-align:center; margin:6px 0 14px; }
  .qr-meta { display:flex; justify-content:space-between; font-weight:700; color:var(--text-soft); font-size:14px; }
  .qr-bar { height:10px; border-radius:6px; background:#e6e9f2; overflow:hidden; margin:8px 0 4px; } .qr-bar i { display:block; height:100%; background:var(--well); width:100%; transition:width .25s linear; }
  .qr-choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .qr-choices button { min-height:64px; border-radius:16px; border:2px solid var(--well); background:#fff; color:var(--well-deep); font:inherit; font-weight:800; font-size:18px; cursor:pointer; padding:8px; word-break:keep-all; }
  .qr-choices button.pick { background:var(--well); color:#fff; }
  .qr-choices button.ok { background:#1f9d57; border-color:#1f9d57; color:#fff; } .qr-choices button.no { background:#fff; border-color:#c9cfdb; color:#9aa3b5; }
  .qr-choices button:disabled { cursor:default; }
  .qr-rank { list-style:none; margin:10px 0 0; padding:0; } .qr-rank li { display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:10px; font-weight:700; } .qr-rank li:nth-child(odd) { background:#f3f5fa; }
  .qr-rank li b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .qr-rank li.me { box-shadow:inset 0 0 0 2px var(--well); }
  .qr-big { text-align:center; font-size:22px; font-weight:800; color:var(--well-deep); margin:6px 0; }
  .qr-seg { display:flex; gap:6px; flex-wrap:wrap; } .qr-seg button { flex:1; min-width:90px; padding:10px 6px; border-radius:12px; border:2px solid var(--well); background:#fff; color:var(--well-deep); font:inherit; font-weight:700; cursor:pointer; } .qr-seg button[aria-pressed="true"] { background:var(--well); color:#fff; }
  .qr-in { box-sizing:border-box; background:#fff; color:#1d2433; width:100%; font:inherit; font-size:20px; padding:12px; border:2px solid #c9cfdb; border-radius:12px; text-align:center; }
  .tw-log { list-style:decimal; margin:8px 0 0; padding-left:22px; font-size:14.5px; } .tw-log li { padding:5px 0; border-bottom:1px solid #eceff5; }
  .tw-log li > span { display:inline-block; width:calc(100% - 92px); vertical-align:top; word-break:keep-all; } .tw-log small { color:var(--text-soft); }
  .tw-log b { display:inline-block; width:86px; text-align:right; color:#5d6676; } .tw-log b.y { color:#1f9d57; } .tw-log b.n { color:#c0432c; }
  .tw-qs { display:grid; grid-template-columns:1fr 1fr; gap:6px; } .tw-qs button { min-height:48px; border-radius:12px; border:1.5px solid var(--well); background:#fff; color:var(--well-deep); font:inherit; font-weight:700; font-size:13.5px; padding:6px; cursor:pointer; word-break:keep-all; }
  .tw-qs button:disabled { border-color:#d5dae6; color:#a7afbf; cursor:default; }
</style>
