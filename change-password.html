<body>
<header class="site">
  <a class="logo" href="index.html"><svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="#2540d8" d="M12 1.500s-6.200 6.400-6.200 10.600a6.200 6.200 0 0 0 12.400 0C18.200 7.900 12 1.500 12 1.500Z"/><path fill="none" stroke="#17287e" stroke-width="1.800" stroke-linecap="round" d="M2.500 17.800c1.900 2.800 5.400 4.600 9.500 4.600s7.600-1.800 9.500-4.600"/></svg>말씀우물</a>
</header>
<div class="wrap">
  <div class="page-hd">
    <h1>비밀번호 바꾸기</h1>
    <p>지금 비밀번호는 초기화된 비밀번호예요.<br>나만 아는 비밀번호로 바꿔 주세요.</p>
  </div>

  <form id="changePasswordForm" class="card">
    <div class="form-row">
      <label for="newPasswordInput">새 비밀번호 (6자 이상)</label>
      <input type="password" id="newPasswordInput" placeholder="••••••" autocomplete="new-password">
    </div>
    <div class="form-row">
      <label for="newPasswordAgain">새 비밀번호 한 번 더</label>
      <input type="password" id="newPasswordAgain" placeholder="••••••" autocomplete="new-password">
    </div>
    <button type="submit" class="btn block">비밀번호 바꾸기</button>
    <p class="msg" id="formMsg" role="alert"></p>
  </form>

  <p style="text-align:center;font-size:14px;"><a href="mypage.html" id="changeLater" style="color:var(--text-soft);text-decoration:underline;">나중에 바꾸기</a></p>
</div>
<script src="assets/supabase-config.js"></script>
<script src="assets/vendor/supabase-js.js"></script>

  initFirstPasswordForm();

</html>
