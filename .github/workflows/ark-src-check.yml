name: 나그네 마을 조각과 게임 파일 일치 확인

# assets/ark-game.js는 ark-src/ 조각으로 만든다.
# 직접 고쳤거나 build.py를 안 돌렸으면 실패해서 저장소 소유자에게 메일이 간다.
on:
  push:
    branches: [master]
    paths:
      - "assets/ark-game.js"
      - "ark.html"
      - "ark-src/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ark-src/build.py --check
