<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>놀이터 랭킹 | 말씀우물</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2540d8">
<link rel="apple-touch-icon" href="assets/icons/icon-512.png">
<script defer src="assets/pwa.js"></script>
<style>
  .rk-game { margin-bottom: 26px; }
  .rk-hd { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 9px; }
  .rk-hd h2 { margin: 0; font-size: 16px; color: var(--well-deep); }
  .rk-hd .rk-rule { font-size: 11.5px; color: var(--text-soft); font-weight: 600; }
  .rk-row { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border: 1.5px solid var(--border); border-radius: 12px; margin-bottom: 7px; background: #fff; }
  .rk-row.mine { border-color: var(--well); background: rgba(37, 64, 216, 0.05); }
  .rk-row.top1 { border-color: #d8a62a; background: rgba(216, 166, 42, 0.09); }
  .rk-no { flex: 0 0 30px; font-weight: 900; font-size: 14px; color: var(--text-soft); text-align: center; }
  .rk-row.top1 .rk-no, .rk-row.top2 .rk-no, .rk-row.top3 .rk-no { font-size: 17px; }
  .rk-name { flex: 1 1 auto; min-width: 0; font-weight: 700; font-size: 14px; color: var(--well-deep); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk-score { flex: 0 0 auto; font-weight: 800; font-size: 13.5px; color: var(--well); }
  .rk-mine-tag { font-size: 10.5px; font-weight: 800; background: rgba(37,64,216,.14); color: var(--well); padding: 2px 7px; border-radius: 999px; margin-left: 6px; }
  .rk-empty { font-size: 13px; color: var(--text-soft); padding: 12px 2px; }
  .rk-mine-card { border: 1.5px solid var(--well); border-radius: 16px; padding: 14px 16px; background: rgba(37,64,216,.045); margin-bottom: 24px; }
  .rk-mine-card h3 { margin: 0 0 10px; font-size: 14.5px; color: var(--well); }
  .rk-mine-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 4px 0; color: var(--well-deep); }
  .rk-mine-row b { color: var(--well); }
  .rk-note { font-size: 12px; color: var(--text-soft); margin: -4px 2px 10px; line-height: 1.6; }
  .rk-day { margin-bottom: 14px; }
  .rk-day-hd { font-size: 12.5px; font-weight: 800; color: var(--well); margin: 0 2px 6px; padding-left: 8px; border-left: 3px solid var(--well); }
  .rk-sub { font-size: 11.5px; font-weight: 600; color: var(--text-soft); }
</style>
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">💧 말씀우물</a>
  <nav><a href="play.html">말씀놀이터</a></nav>
</header>
<div class="wrap">
  <div class="page-hd">
    <h1>🏆 놀이터 랭킹</h1>
    <p>게임마다 제일 잘한 기록으로 줄을 세워요.</p>
  </div>

  <div id="rkMineCard" class="rk-mine-card" style="display:none;">
    <h3>🙋 내 기록</h3>
    <div id="rkMineList"></div>
  </div>

  <div id="rkBody">
    <p class="rk-empty">불러오는 중...</p>
  </div>

  <div id="rkMemory"></div>

  <div class="card tint-blue" style="margin-top:8px;">
    <p class="msg" style="margin:0;">💠 기록은 <strong>제일 잘했을 때 한 번</strong>만 남아요. 여러 번 해도 손해 보지 않으니 편하게 도전해요!</p>
  </div>

  <a href="play.html" class="btn ghost block" style="margin-top:20px;">말씀놀이터로 돌아가기</a>
</div>
<footer class="site">
  <img src="assets/logos/logos-color.png" alt="로고스교회 로고" style="width:34px;height:34px;object-fit:contain;">
  <p style="margin:6px 0 10px;color:var(--well-deep);font-weight:600;font-size:12.5px;">100명의 훈련된 예수 제자를 세워가는 로고스교회 중등부</p>
  💧 말씀우물
</footer>
<script src="assets/supabase-config.js"></script>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/rankings.js"></script>
<script src="assets/appshell.js"></script>
<script>initRankings();</script>
</body>
</html>
