<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>로그인 | 말씀우물</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">💧 말씀우물</a>
  <nav><a href="signup.html">회원가입</a></nav>
</header>
<div class="wrap">
  <section class="hero">
    <h1>로그인</h1>
    <p>다시 만나서 반가워요</p>
  </section>

  <form id="loginForm" class="card">
    <div class="form-row">
      <label for="emailInput">이메일</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
    </div>
    <div class="form-row">
      <label for="passwordInput">비밀번호</label>
      <input type="password" id="passwordInput" placeholder="••••••">
    </div>
    <button type="submit" class="btn block">로그인</button>
    <p class="msg" id="formMsg"></p>
  </form>

  <p style="text-align:center;font-size:13px;color:var(--text-soft);">계정이 없나요? <a href="signup.html" style="color:var(--well);">회원가입</a></p>
</div>
<footer class="site">💧 말씀우물 · <a href="about.html">소개</a> · <a href="privacy.html">개인정보처리방침</a></footer>
<script src="assets/supabase-config.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
<script>
  initLoginForm();
</script>
</body>
</html>
