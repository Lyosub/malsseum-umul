<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>로그인 | 말씀우물</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14707a">
<link rel="apple-touch-icon" href="assets/icons/icon-512.png">
<script defer src="assets/pwa.js"></script>
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">💧 말씀우물</a>
  <nav><a href="signup.html">회원가입</a></nav>
</header>
<div class="wrap">
  <section class="hero">
    <h1>로그인</h1>
    <p>다시 만나서 반가워요</p>
  </section>

  <form id="loginForm" class="card">
    <div class="form-row">
      <label for="emailInput">이메일</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
    </div>
    <div class="form-row">
      <label for="passwordInput">비밀번호</label>
      <input type="password" id="passwordInput" placeholder="••••••">
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;margin:-4px 0 14px;font-size:13px;color:var(--text-soft);">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="rememberEmailCheck" style="width:auto;"> 이메일 저장
      </label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="keepLoggedInCheck" checked style="width:auto;"> 로그인 상태 유지
      </label>
      <p class="msg" style="margin:0 0 0 22px;">해제하면 브라우저를 닫을 때 자동으로 로그아웃돼요.</p>
    </div>
    <button type="submit" class="btn block">로그인</button>
    <p class="msg" id="formMsg"></p>
  </form>

  <p style="text-align:center;font-size:13px;margin-top:10px;">
    <a href="#" id="forgotPasswordLink" style="color:var(--text-soft);text-decoration:underline;">비밀번호를 잊으셨나요?</a>
    &nbsp;·&nbsp;
    <a href="#" id="findEmailLink" style="color:var(--text-soft);text-decoration:underline;">이메일을 잊으셨나요?</a>
  </p>

  <div id="forgotPasswordSection" class="card" style="display:none;">
    <form id="forgotPasswordForm">
      <div class="form-row">
        <label for="resetEmailInput">가입한 이메일</label>
        <input type="email" id="resetEmailInput" placeholder="you@example.com">
      </div>
      <button type="submit" class="btn ghost block">재설정 링크 보내기</button>
      <p class="msg" id="forgotPasswordMsg"></p>
    </form>
  </div>

  <div id="findEmailSection" class="card" style="display:none;">
    <form id="findEmailForm">
      <p class="msg" style="margin-top:0;">가입할 때 등록한 닉네임과 이름(본명)을 입력하면, 가입하신 이메일 일부를 확인해드려요.</p>
      <div class="form-row">
        <label for="findEmailNickname">닉네임 (활동명)</label>
        <input type="text" id="findEmailNickname" placeholder="말씀우물에서 쓰는 이름">
      </div>
      <div class="form-row">
        <label for="findEmailRealName">이름 (본명)</label>
        <input type="text" id="findEmailRealName" placeholder="가입할 때 입력한 실명">
      </div>
      <button type="submit" class="btn ghost block">이메일 확인하기</button>
      <p class="msg" id="findEmailMsg"></p>
    </form>
  </div>

  <p style="text-align:center;font-size:13px;color:var(--text-soft);">계정이 없나요? <a href="signup.html" style="color:var(--well);">회원가입</a></p>
</div>
<footer class="site">
  <img src="assets/logos/logos-color.png" alt="로고스교회 로고" style="width:34px;height:34px;object-fit:contain;">
  <p style="margin:6px 0 10px;color:var(--well-deep);font-weight:600;font-size:12.5px;">100명의 훈련된 예수 제자를 세워가는 로고스교회 중등부</p>
  💧 말씀우물 · <a href="about.html">소개</a> · <a href="privacy.html">개인정보처리방침</a>
</footer>
<script src="assets/supabase-config.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
<script>
  initLoginForm();
  initForgotPasswordForm();
  initFindEmailForm();
</script>
</body>
</html>
