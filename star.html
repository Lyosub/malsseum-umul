<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>별 밝히기 | 응원 보내기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<meta name="theme-color" content="#0b1026">
<style>
  [hidden] { display: none !important; }
  :root {
    --night: #0b1026; --night2: #141c3d; --ink: #eef0fb; --dim: #a7add0;
    --gold: #f5d27a; --gold2: #e9b949; --line: rgba(238,240,251,.14); --err: #ff9b8f;
    --serif: "Gowun Batang", "Nanum Myeongjo", serif;
    --sans: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, #1b2552 0%, var(--night) 60%) fixed, var(--night);
    color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 440px; margin: 0 auto; display: grid; gap: 18px; }
  main > * { min-width: 0; }
  header { text-align: center; padding-top: 8px; }
  header .eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--gold); }
  header h1 { font-family: var(--serif); font-size: 30px; margin: 4px 0 6px; text-wrap: balance; }
  header p { margin: 0; color: var(--dim); font-size: 14px; }
  .card { background: rgba(20,28,61,.82); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; display: grid; gap: 14px; }
  label { font-size: 13px; color: var(--dim); display: block; margin-bottom: 6px; }
  select, input, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--night); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; outline: none;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--gold); }
  textarea { resize: none; min-height: 84px; }
  .count { text-align: right; font-size: 12px; color: var(--dim); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chip:active, .chip:hover { border-color: var(--gold); color: var(--gold); }
  .toggle { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .toggle input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--gold2); flex: none; }
  .notice { font-size: 12.5px; color: var(--dim); background: rgba(245,210,122,.07); border-radius: 10px; padding: 10px 12px; }
  button.send {
    font: inherit; font-weight: 700; font-size: 17px; color: #241a02; background: linear-gradient(180deg, var(--gold), var(--gold2));
    border: 0; border-radius: 14px; padding: 15px; cursor: pointer; width: 100%;
  }
  button.send:disabled { opacity: .55; }
  button:focus-visible, .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .msg { min-height: 1.4em; text-align: center; font-size: 14px; }
  .msg.err { color: var(--err); }
  .done { text-align: center; display: grid; gap: 10px; padding: 26px 16px; }
  .done .star { font-size: 54px; line-height: 1; filter: drop-shadow(0 0 18px rgba(245,210,122,.8)); animation: pop .6s ease-out; }
  .done h2 { font-family: var(--serif); margin: 0; font-size: 24px; }
  .done p { margin: 0; color: var(--dim); font-size: 14px; }
  .verse { text-align: center; font-family: var(--serif); font-size: 13px; color: var(--dim); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .done .star { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">2026 교회학교 성탄발표회</div>
    <h1>별 밝히기</h1>
    <p>교회학교 학생들에게 응원 한 줄을 보내 주세요.<br>선생님이 확인하면 본당 화면에 별로 켜집니다.</p>
  </header>

  <form class="card" id="form" autocomplete="off">
    <div>
      <label for="dept">내 부서</label>
      <select id="dept" required>
        <option value="">골라 주세요</option>
        <option>영어예배부</option><option>영아부</option><option>유아부</option><option>유치부</option>
        <option>유년부</option><option>초등부</option><option>중등부</option><option>고등부</option>
      </select>
      <div class="count" style="text-align:left">학생·교사는 소속 부서, 학부모는 자녀의 부서, 그 밖의 성도는 응원하고 싶은 부서</div>
    </div>
    <div>
      <label for="name">이름</label>
      <input id="name" maxlength="20" placeholder="예: 김OO 집사" required>
    </div>
    <div>
      <label for="body">응원 한 줄</label>
      <textarea id="body" maxlength="40" placeholder="40자 안에서 적어 주세요" required></textarea>
      <div class="count"><span id="len">0</span> / 40</div>
      <div class="chips" id="chips"></div>
    </div>
    <label class="toggle" for="showName">
      <input type="checkbox" id="showName" checked>
      <span>본당 화면에 내 이름을 함께 띄웁니다<br><span style="color:var(--dim);font-size:12.5px">끄면 「한 성도」로 표시됩니다.</span></span>
    </label>
    <div class="notice">경품 추첨에 당첨되면 화면에 응원과 함께 <b>이름과 부서가 공개</b>됩니다.</div>
    <button class="send" id="send" type="submit">별 보내기 ⭐</button>
    <div class="msg" id="msg" role="status"></div>
  </form>

  <section class="card done" id="done" hidden>
    <div class="star">⭐</div>
    <h2>응원을 보냈습니다</h2>
    <p>선생님이 확인하면 본당 화면 하늘에 별로 켜집니다.</p>
    <button class="chip" id="again" type="button" style="justify-self:center">응원 하나 더 보내기</button>
  </section>

  <p class="verse">보라 내가 온 백성에게 미칠 큰 기쁨의 좋은 소식을 너희에게 전하노라<br>누가복음 2:10</p>
</main>

<script src="assets/supabase-config.js"></script>
<script src="assets/vendor/supabase-js.js"></script>
<script>
(function () {
  var ROOM = (location.hash || '').replace('#', '') || 'demo';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var $ = function (id) { return document.getElementById(id); };
  var examples = ['너희의 찬양이 오늘 밤 가장 큰 선물이었어', '하나님이 너희를 정말 기뻐하셔', '무대에 선 용기, 멋있었어!', '너희가 세상의 빛이야', '내년 성탄에도 이 자리에서 만나자'];

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var device = store('star_device');
  if (!device) { device = 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36); store('star_device', device); }
  if (store('star_name')) $('name').value = store('star_name');
  if (store('star_dept')) $('dept').value = store('star_dept');

  examples.forEach(function (t) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = t;
    b.onclick = function () { $('body').value = t; $('len').textContent = t.length; };
    $('chips').appendChild(b);
  });
  $('body').addEventListener('input', function () { $('len').textContent = $('body').value.length; });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = $('msg'); msg.className = 'msg'; msg.textContent = '';
    if (!$('dept').value) { msg.className = 'msg err'; msg.textContent = '내 부서를 골라 주세요.'; return; }
    $('send').disabled = true; msg.textContent = '보내는 중…';
    var payload = { p_room: ROOM, p_device: device, p_name: $('name').value, p_dept: $('dept').value, p_body: $('body').value, p_show_name: $('showName').checked };
    var tries = 0;
    (function go() {
      sb.rpc('star_send', payload).then(function (res) {
        if (res.error) throw res.error;
        var d = res.data || {};
        $('send').disabled = false;
        if (!d.ok) { msg.className = 'msg err'; msg.textContent = d.error || '보내지 못했습니다.'; return; }
        store('star_name', $('name').value); store('star_dept', $('dept').value);
        msg.textContent = ''; $('body').value = ''; $('len').textContent = '0';
        $('form').hidden = true; $('done').hidden = false;
      }).catch(function () {
        if (++tries < 3) { msg.textContent = '연결이 느립니다. 다시 보내는 중…'; setTimeout(go, 1500); return; }
        $('send').disabled = false; msg.className = 'msg err';
        msg.textContent = '보내지 못했습니다. 와이파이를 끄고 데이터로 다시 보내 주세요.';
      });
    })();
  });
  $('again').onclick = function () { $('done').hidden = true; $('form').hidden = false; $('body').focus(); };
})();
</script>
</body>
</html>
