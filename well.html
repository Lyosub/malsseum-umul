<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <form id="wellForm" class="card">

    </div>
    <button type="submit" class="btn block">말씀 길어 올리기 💧</button>

  </form>

  <div id="wellResult" style="display:none;">
    <div id="wellVerseCard" class="verse-card"></div>
  </div>

  <p class="msg" style="text-align:center;">※ 간단한 키워드 매칭으로 말씀을 안내해드리는 도구예요. 더 깊은 나눔이 필요하다면 가까운 목회자·공동체와 함께 이야기해보세요.</p>
</div>
