<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>추억모음집 | 말씀우물</title>
<meta name="description" content="로고스교회 중등부 행사 사진·영상 모음. 함께한 순간을 다시 봐요.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2540d8">
<link rel="apple-touch-icon" href="assets/icons/icon-512.png">
<script defer src="assets/pwa.js"></script>
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">💧 말씀우물</a>
  <nav>
    <a href="login.html" id="navLogin">로그인</a>
    <a href="mypage.html" id="navMypage" style="display:none;">마이페이지</a>
  </nav>
</header>
<div class="wrap">
  <div class="page-hd">
    <h1>📸 추억모음집</h1>
    <p>함께한 순간을 다시 봐요</p>
  </div>
</div>

<div class="wrap" id="memoriesContent" style="display:none;">
  <div id="memoriesList"></div>
</div>

<div class="wrap card" id="approvalGate" style="display:none;text-align:center;">
  <p style="color:var(--text-soft);font-size:13.5px;line-height:1.7;margin:0 0 14px;">
    학생·교인 얼굴이 나오는 사진이라, 우물지기가 확인한 분만 볼 수 있게 해뒀어요.
  </p>
  <button type="button" class="btn block" id="requestApprovalBtn">우물지기에게 승인 요청하기</button>
  <p class="msg" id="requestApprovalMsg" style="margin-top:8px;"></p>
</div>

<div class="wrap auth-gate" id="loginGate" style="display:none;">
  <p>로그인이 필요한 페이지예요.</p>
  <a href="login.html" class="btn">로그인하러 가기</a>
</div>

<footer class="site">
  <img src="assets/logos/logos-color.png" alt="로고스교회 로고" style="width:34px;height:34px;object-fit:contain;">
  <p style="margin:6px 0 10px;color:var(--well-deep);font-weight:600;font-size:12.5px;">100명의 훈련된 예수 제자를 세워가는 로고스교회 중등부</p>
  💧 말씀우물 · <a href="about.html">소개</a> · <a href="privacy.html">개인정보처리방침</a>
</footer>
<script src="assets/supabase-config.js"></script>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/auth.js"></script>
<script>
  initHeaderAuthState();

  // 행사별 구글 포토 공유 앨범 모음. 새 행사가 끝나면 여기 한 줄씩 위에 추가하면 됨.
  var ALBUMS = [
    { title: "2026 중등부 동계 수련회",         date: "2026", emoji: "❄️", url: "https://photos.app.goo.gl/6PEv6euk8dounVsk6" },
    { title: "2026 중등부 상반기 친구초청잔치",  date: "2026", emoji: "🎉", url: "https://photos.app.goo.gl/rEH4ZH3BhXDD26Vt5" },
    { title: "2026 중고등부 하계 수련회",        date: "2026", emoji: "⛺", url: "https://photos.app.goo.gl/8v3DS7JzfewyzTbk7" },
    { title: "2025 중등부 하계 수련회",          date: "2025", emoji: "⛺", url: "https://photos.app.goo.gl/B3mxzKAFUymsGShHA" },
    { title: "2025 중등부 하반기 친구초청잔치",  date: "2025", emoji: "🎉", url: "https://photos.app.goo.gl/eAv1deFc9Ypso5hy8" },
    { title: "2022 중등부 하계 수련회",          date: "2022", emoji: "⛺", url: "https://photos.app.goo.gl/8rLbCZG4nTaiGhfx7" },
    { title: "중등부 행사 사진 전체 모음",       date: "계속 업데이트", emoji: "📷", url: "https://photos.app.goo.gl/nZ7ApfGXNNMdtCyu7" }
  ];

  function renderAlbums() {
    var list = document.getElementById("memoriesList");
    list.innerHTML = ALBUMS.map(function (a) {
      return (
        '<a class="card" href="' + a.url + '" target="_blank" rel="noopener" ' +
          'style="display:flex;align-items:center;gap:14px;text-decoration:none;margin-bottom:12px;">' +
          '<div style="font-size:26px;flex:none;">' + a.emoji + '</div>' +
          '<div style="flex:1 1 auto;min-width:0;">' +
            '<div style="font-weight:800;color:var(--well-deep);">' + a.title + '</div>' +
            '<div style="font-size:12.5px;color:var(--text-soft);">' + a.date + ' · 구글 포토로 이동</div>' +
          '</div>' +
          '<span style="color:var(--text-soft);">›</span>' +
        '</a>'
      );
    }).join("");
  }

  getSession().then(function (session) {
    if (!session) {
      var _lg=document.getElementById("navLoginGated"); if(_lg)_lg.style.display="inline"; var _lo=document.getElementById("logoutBtn"); if(_lo)_lo.style.display="none";
      document.getElementById("loginGate").style.display = "block";
      return;
    }
    var client = getClient();
    if (!client) return;
    client.from("profiles").select("photos_approved, photos_approval_requested_at").eq("user_id", session.user.id).maybeSingle().then(function (res) {
      var p = res.data;
      if (p && p.photos_approved) {
        document.getElementById("memoriesContent").style.display = "block";
        renderAlbums();
        return;
      }
      document.getElementById("approvalGate").style.display = "block";
      var btn = document.getElementById("requestApprovalBtn");
      var msg = document.getElementById("requestApprovalMsg");
      if (p && p.photos_approval_requested_at) {
        btn.style.display = "none";
        msg.textContent = "이미 요청했어요. 우물지기가 확인하면 바로 볼 수 있어요.";
        return;
      }
      btn.addEventListener("click", function () {
        btn.disabled = true;
        client.from("profiles").update({ photos_approval_requested_at: new Date().toISOString() }).eq("user_id", session.user.id).then(function (r) {
          if (r.error) {
            msg.textContent = "요청 중 문제가 생겼어요. 다시 시도해주세요.";
            btn.disabled = false;
            return;
          }
          btn.style.display = "none";
          msg.textContent = "요청했어요! 우물지기가 확인하면 바로 볼 수 있어요.";
        });
      });
    });
  });
</script>
<script src="assets/appshell.js"></script>
</body>
</html>
