<body>
<header class="site">
  <a class="logo" href="index.html">💧 말씀우물</a>
  <nav>
    <a href="login.html" id="navLogin">로그인</a>
    <a href="mypage.html" id="navMypage" style="display:none;">마이페이지</a>
  </nav>
</header>
<div class="wrap">
  <div class="page-hd">
    <h1>오늘의 찬양</h1>
    <p>오늘 하루, 이 찬양 한 곡 들어보세요</p>
  </div>

  <div class="card tint-blue" style="text-align:center;">
    <span class="ico-circle" style="margin:0 auto 10px;">🎵</span>
    <div id="songTitle" style="font-weight:800;font-size:20px;color:var(--well-deep);"></div>
    <div id="songArtist" style="font-size:13.5px;color:var(--text-soft);margin-top:4px;"></div>
    <a id="songLink" class="pill-blue block" style="margin-top:16px;" target="_blank" rel="noopener">유튜브에서 듣기 ›</a>
  </div>

  <div class="sect-hd"><h2>중등부가 자주 부르는 찬양</h2></div>
  <div id="songList"></div>
</div>
<footer class="site">
  <img src="assets/logos/logos-color.png" alt="로고스교회 로고" style="width:34px;height:34px;object-fit:contain;">
  <p style="margin:6px 0 10px;color:var(--well-deep);font-weight:600;font-size:12.5px;">100명의 훈련된 예수 제자를 세워가는 로고스교회 중등부</p>
  💧 말씀우물 · <a href="about.html">소개</a> · <a href="privacy.html">개인정보처리방침</a><br>
  성경 인용: 개역개정판, ⓒ 대한성서공회
</footer>
<script src="assets/verses-data.js"></script>
<script src="assets/worship-songs-data.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/script.js"></script>
<script>
  initHeaderAuthState();
  (function () {
    var song = getSongOfTheDay();
    document.getElementById("songTitle").textContent = song.title;
    document.getElementById("songArtist").textContent = song.artist;
    document.getElementById("songLink").href = worshipYoutubeSearchUrl(song);

    var list = document.getElementById("songList");
    WORSHIP_SONGS.forEach(function (s) {
      var el = document.createElement("a");
      el.href = worshipYoutubeSearchUrl(s);
      el.target = "_blank";
      el.rel = "noopener";
      el.className = "card";
      el.style.cssText = "display:flex;align-items:center;gap:12px;text-decoration:none;";
      el.innerHTML =
        '<span class="ico-circle">🎶</span>' +
        '<div style="flex:1 1 auto;min-width:0;">' +
          '<div style="font-weight:800;color:var(--well-deep);">' + s.title + '</div>' +
          '<div style="font-size:12px;color:var(--text-soft);">' + s.artist + '</div>' +
        '</div>' +
        '<span style="color:var(--text-soft);">›</span>';
      list.appendChild(el);
    });
  })();
</script>
<script src="assets/appshell.js"></script>
</body>
</html>
