<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>회원가입 | 말씀우물</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">💧 말씀우물</a>
  <nav><a href="login.html">로그인</a></nav>
</header>
<div class="wrap">
  <section class="hero">
    <h1>회원가입</h1>
    <p>기록을 저장하고 출석을 이어가려면 계정이 필요해요</p>
  </section>

  <form id="signupForm" class="card">
    <div class="form-row">
      <label for="nicknameInput">닉네임</label>
      <input type="text" id="nicknameInput" placeholder="말씀우물에서 쓸 이름">
    </div>
    <div class="form-row">
      <label for="emailInput">이메일</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
    </div>
    <div class="form-row">
      <label for="passwordInput">비밀번호 (6자 이상)</label>
      <input type="password" id="passwordInput" placeholder="••••••">
    </div>
    <button type="submit" class="btn block">가입하기</button>
    <p class="msg" id="formMsg"></p>
  </form>

  <p style="text-align:center;font-size:13px;color:var(--text-soft);">이미 계정이 있나요? <a href="login.html" style="color:var(--well);">로그인</a></p>
</div>
<footer class="site">
  <img src="assets/logos/logos-color.png" alt="로고스교회 로고" style="width:34px;height:34px;object-fit:contain;">
  <p style="margin:6px 0 10px;color:var(--well-deep);font-weight:600;font-size:12.5px;">100명의 훈련된 예수 제자를 세워가는 로고스교회 중등부</p>
  💧 말씀우물 · <a href="about.html">소개</a> · <a href="privacy.html">개인정보처리방침</a>
</footer>
<script src="assets/supabase-config.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
<script>
  initSignupForm();
</script>
</body>
</html>
